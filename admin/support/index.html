<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>고객센터 문의 | 이룸 관리자</title>
  <style>
    :root{--ink:#20241f;--muted:#77766f;--line:#e1ddd2;--cream:#f6f4ee;--navy:#17213f;--gold:#c1a15c;--green:#326541;--amber:#895f17;--red:#a44e4e;--sans:Arial,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.5}.bar{min-height:72px;padding:0 max(20px,calc((100vw - 1220px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--navy);color:#fff}.bar small{display:block;color:#d0b979;font-size:10px;font-weight:700;letter-spacing:.14em}.bar h1{margin:2px 0 0;font-size:20px}.back{border:1px solid rgba(255,255,255,.35);padding:9px 12px;color:#fff;text-decoration:none;font-size:13px}.wrap{width:min(1220px,calc(100% - 40px));margin:28px auto 70px}.lead{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:16px}.lead h2{margin:0;font-size:22px;letter-spacing:-.04em}.lead p{margin:6px 0 0;color:var(--muted);font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.toolbar select,.toolbar button{height:38px;border:1px solid #d3cdbf;background:#fff;padding:0 10px;font:13px var(--sans)}.toolbar button{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700;cursor:pointer}.notice{border:1px solid #e1c2c2;background:#fff8f8;padding:15px;color:#8f3c3c;font-size:13px}.list{display:grid;gap:12px}.inquiry{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:20px;border:1px solid var(--line);background:#fff;padding:20px}.inquiry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.inquiry h3{margin:0;font-size:16px}.tag{display:inline-block;border-radius:999px;padding:3px 8px;background:#edf0f4;color:#29334f;font-size:11px;font-weight:700}.meta{margin:8px 0 0;color:var(--muted);font-size:12px}.message{margin:14px 0 0;padding:13px 14px;border-left:3px solid var(--gold);background:#fbfaf7;white-space:pre-wrap;word-break:break-word;font-size:14px}.manage{align-self:start;border-left:1px solid var(--line);padding-left:18px}.manage label{display:block;margin-bottom:7px;font-size:11px;font-weight:700;color:var(--muted)}.manage select,.manage button{width:100%;height:38px;border:1px solid #d2ccc0;background:#fff;padding:0 9px;font:13px var(--sans)}.manage button{margin-top:8px;background:#20241f;border-color:#20241f;color:#fff;cursor:pointer;font-weight:700}.empty{border:1px dashed #cfc8bb;background:#fff;padding:40px;text-align:center;color:var(--muted);font-size:13px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){.bar{min-height:62px}.wrap{width:min(100% - 28px,1220px);margin-top:20px}.lead{display:block}.toolbar{margin-top:14px}.inquiry{grid-template-columns:1fr;padding:16px}.manage{border-left:0;border-top:1px solid var(--line);padding:14px 0 0}.message{font-size:13px}}
  </style>
</head>
<body>
  <header class="bar"><div><small>IRUM OS / CUSTOMER CENTER</small><h1>고객센터 문의</h1></div><a class="back" href="/admin/">관리자 홈</a></header>
  <main class="wrap"><section class="lead"><div><h2>접수된 문의를 확인합니다.</h2><p>문의 내용과 처리 상태는 관리자만 볼 수 있습니다.</p></div><div class="toolbar"><label class="sr" for="status-filter">처리 상태</label><select id="status-filter"><option value="all">전체 상태</option><option value="new">새 문의</option><option value="in_progress">확인 중</option><option value="resolved">답변 완료</option></select><button type="button" id="refresh">새로고침</button></div></section><p id="notice" class="notice" hidden></p><section id="inquiry-list" class="list" aria-live="polite"><div class="empty">문의 목록을 불러오는 중입니다.</div></section></main>
  <script>
    const endpoint="https://wiesmommcmwwwkwufgqg.supabase.co/functions/v1/temporary-intake-submit",key="sb_publishable_Y_9qyDnB3KYXKllIPJq9iQ_2xyyQO9f",sessionKey="irum-temp-admin-session-v1";
    const esc=(v="")=>String(v??"").replace(/[&<>'"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
    const typeLabel={application:"신청·심사",matching:"1:1 매칭",social:"프라이빗 소셜",account:"계정·개인정보",other:"기타"};
    const statusLabel={new:"새 문의",in_progress:"확인 중",resolved:"답변 완료"};
    const date=(v)=>v?new Date(v).toLocaleString("ko-KR",{dateStyle:"medium",timeStyle:"short"}):"기록 없음";
    const readSession=()=>{try{const data=JSON.parse(sessionStorage.getItem(sessionKey)||"null");return data?.access_token?data:null}catch{return null}};
    async function api(action,body={}){const session=readSession();if(!session)throw new Error("ADMIN_LOGIN_REQUIRED");const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json",apikey:key,Authorization:"Bearer "+session.access_token},body:JSON.stringify({action,...body})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"REQUEST_FAILED");return data}
    let inquiries=[];
    function render(){const filter=document.getElementById("status-filter").value;const rows=inquiries.filter((row)=>filter==="all"||row.status===filter);document.getElementById("inquiry-list").innerHTML=rows.length?rows.map((row)=>`<article class="inquiry"><div><div class="inquiry-head"><h3>${esc(typeLabel[row.inquiry_type]||"기타")} 문의</h3><span class="tag">${esc(statusLabel[row.status]||row.status)}</span></div><p class="meta">접수 ${esc(date(row.created_at))}${row.name?` · ${esc(row.name)}`:""}${row.phone?` · ${esc(row.phone)}`:""}${row.email?` · ${esc(row.email)}`:""}</p><p class="message">${esc(row.message)}</p></div><div class="manage"><label for="status-${esc(row.id)}">처리 상태</label><select id="status-${esc(row.id)}" data-status-select="${esc(row.id)}">${Object.entries(statusLabel).map(([value,label])=>`<option value="${value}" ${row.status===value?"selected":""}>${label}</option>`).join("")}</select><button type="button" data-status-save="${esc(row.id)}">상태 저장</button></div></article>`).join(""):'<div class="empty">조건에 맞는 문의가 없습니다.</div>';document.querySelectorAll("[data-status-save]").forEach((button)=>button.onclick=async()=>{const id=button.dataset.statusSave,select=document.querySelector(`[data-status-select="${CSS.escape(id)}"]`);button.disabled=true;try{await api("admin-support-inquiry-status",{inquiry_id:id,status:select.value});await load()}catch(error){show(error.message==="ADMIN_LOGIN_REQUIRED"?"관리자 로그인 후 다시 이용해 주세요.":"상태를 저장하지 못했습니다.")}finally{button.disabled=false}})}
    function show(message){const node=document.getElementById("notice");node.hidden=false;node.textContent=message}
    async function load(){document.getElementById("notice").hidden=true;try{const data=await api("admin-support-inquiry-list");inquiries=data.inquiries||[];render()}catch(error){document.getElementById("inquiry-list").innerHTML='<div class="empty">문의 목록을 불러오지 못했습니다.</div>';show(error.message==="ADMIN_LOGIN_REQUIRED"?"관리자 로그인 후 이용해 주세요.":"문의 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.")}}
    document.getElementById("status-filter").onchange=render;document.getElementById("refresh").onclick=load;load();
  </script>
</body>
</html>
