      const TEMP_ADMIN_BUILD_ID = "temp-admin-pasted5-operations-20260827-3";

      const API_TIMEOUT_MS = 15000;
      const READ_RETRY_ACTIONS = new Set(["admin-list","snapshot-list","operational-list","consultation-import-manifest","secondary-admin-list","admin-operations-list"]);
      const RETRY_DELAYS_MS = [350,900];
      const config = {
        url: "https://wiesmommcmwwwkwufgqg.supabase.co",
        key: "sb_publishable_Y_9qyDnB3KYXKllIPJq9iQ_2xyyQO9f",
        endpoint: "https://wiesmommcmwwwkwufgqg.supabase.co/functions/v1/temporary-intake-submit",
        secondaryEndpoint: "https://wiesmommcmwwwkwufgqg.supabase.co/functions/v1/temporary-secondary-profile",
      };
      const sessionKey = "irum-temp-admin-session-v1";
      const issuedLinksKey = "irum-temp-secondary-issued-links-v1";
      const loginAuditKey = "irum-temp-admin-login-audit-v1";
      const app = document.getElementById("app");
      const state = { page:"dashboard", loading:false, loadPromise:null, loadedAt:0, records:[], legacy:[], operational:[], consultations:[], forms:[], documents:[], reviews:[], secondaryEvents:[], workflows:[], workflowEvents:[], schedules:[], members:[], matchingCases:[], matchingEvents:[], socialEvents:[], legacySocialEvents:[], audit:[], selected:null, filters:{ q:"", stage:"all", service:"all", sent:"all", submitted:"all", gender:"all", owner:"all", source:"all", duplicate:"all" } };
      const esc = (value="") => String(value ?? "").replace(/[&<>'"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);
      const text = (value) => String(value ?? "").trim();
      const filterQueryKeys={q:"q",stage:"stage",service:"service",sent:"secondaryLink",submitted:"secondaryCompletion",gender:"gender",owner:"owner",source:"source",duplicate:"duplicate"};
      const filterAllowed={stage:new Set(["all","new","first_review","secondary_send_needed","secondary_waiting","secondary_in_progress","secondary_review_needed","approved","hold","rejected","member_converted"]),service:new Set(["all","matching","social","both"]),sent:new Set(["all","unsent","sent"]),submitted:new Set(["all","pending","submitted"]),gender:new Set(["all","male","female"]),source:new Set(["all","legacy","temporary"]),duplicate:new Set(["all","yes","no"])};
      function readFilterQuery(){const query=new URLSearchParams(location.search),next={};for(const [key,param] of Object.entries(filterQueryKeys)){const value=text(query.get(param));if(key==="q")next.q=value.slice(0,100);else if(key==="owner")next.owner=value.slice(0,160)||"all";else next[key]=filterAllowed[key]?.has(value)?value:"all"}return next}
      function writeFilterQuery(){const query=new URLSearchParams();for(const [key,param] of Object.entries(filterQueryKeys)){const value=state.filters[key];if(key==="q"?value:value!=="all")query.set(param,value)}history.replaceState({page:state.page},"",`${location.pathname}${query.size?`?${query}`:""}`)}
      Object.assign(state.filters,readFilterQuery());
      const date = (value) => value ? new Date(value).toLocaleString("ko-KR",{dateStyle:"medium",timeStyle:"short"}) : "기록 없음";
      const dateOnly = (value) => value ? new Date(value).toLocaleDateString("ko-KR",{month:"short",day:"numeric",weekday:"short"}) : "미정";
      const localInput = (value) => value ? new Date(new Date(value).getTime()-new Date(value).getTimezoneOffset()*60000).toISOString().slice(0,16) : "";
      const normalizePhone = (value) => text(value).replace(/\D/g,"");
      const formatPhone = (value) => { const v=normalizePhone(value); return /^010\d{8}$/.test(v)?v.replace(/(010)(\d{4})(\d{4})/,"$1-$2-$3"):text(value)||"연락처 미입력"; };
      const age = (year) => /^\d{4}$/.test(String(year||"")) ? new Date().getFullYear()-Number(year) : "–";
      const parseList = (value) => { if(Array.isArray(value)) return value; try{const p=JSON.parse(value||"[]");return Array.isArray(p)?p:[];}catch{return [];} };
      const latest = (rows, field="created_at") => rows.slice().sort((a,b)=>new Date(b[field]||0)-new Date(a[field]||0))[0]||null;
      const readSession = () => { try{const s=JSON.parse(sessionStorage.getItem(sessionKey)||"null");if(!s?.access_token)return null;if(s.expires_at&&s.expires_at*1000<=Date.now()+30000){sessionStorage.removeItem(sessionKey);return null;}return s;}catch{sessionStorage.removeItem(sessionKey);return null;} };
      const readLinks = () => { try{const v=JSON.parse(sessionStorage.getItem(issuedLinksKey)||"{}");return v&&typeof v==="object"?v:{};}catch{return {};} };
      const rememberLink = (id,url) => { const links=readLinks();links[String(id)]=url;sessionStorage.setItem(issuedLinksKey,JSON.stringify(links)); };
      const forgetLink = (id) => { const links=readLinks();delete links[String(id)];sessionStorage.setItem(issuedLinksKey,JSON.stringify(links)); };
      const wait=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
      const transientError=(error)=>error?.code==="TEMPORARY_INTAKE_UNAVAILABLE"||error?.code==="EDGE_TIMEOUT"||error?.code==="NETWORK_UNAVAILABLE"||error?.code==="REQUEST_FAILED"||error?.status===429||Number(error?.status)>=500;
      async function api(endpoint,action,body={}){
        const session=readSession();
        if(!session)throw Object.assign(new Error("로그인이 필요합니다."),{code:"UNAUTHENTICATED"});
        const retryable=READ_RETRY_ACTIONS.has(action);
        const attempts=retryable?RETRY_DELAYS_MS.length+1:1;
        let lastError;
        for(let attempt=0;attempt<attempts;attempt+=1){
          const controller=new AbortController();
          const timeout=setTimeout(()=>controller.abort(),API_TIMEOUT_MS);
          try{
            const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json",apikey:config.key,Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action,...body}),signal:controller.signal});
            const data=await response.json().catch(()=>({}));
            if(!response.ok){
              const code=response.status===401?"UNAUTHENTICATED":data.error||"REQUEST_FAILED";
              throw Object.assign(new Error(code==="TEMPORARY_INTAKE_UNAVAILABLE"?"운영 데이터 조회가 일시적으로 지연되고 있습니다.":data.error||"요청을 처리하지 못했습니다."),{code,status:response.status,data});
            }
            return data;
          }catch(error){
            lastError=error?.name==="AbortError"?Object.assign(new Error("Edge 응답 시간이 초과되었습니다."),{code:"EDGE_TIMEOUT",status:0}):error instanceof TypeError?Object.assign(new Error("네트워크 연결이 일시적으로 불안정합니다."),{code:"NETWORK_UNAVAILABLE",status:0}):error;
            if(!retryable||!transientError(lastError)||attempt>=attempts-1)throw lastError;
            await wait(RETRY_DELAYS_MS[attempt]);
          }finally{clearTimeout(timeout)}
        }

      function renderApplicants(){const items=filteredItems(),all=groupItems(),owners=[...new Set(all.map(i=>i.workflow?.assigned_to||i.legacyConsult.consultantName).filter(Boolean))].sort();if(state.filters.owner!=="all"&&!owners.includes(state.filters.owner))state.filters.owner="all";shell("신청자","WORKFLOW / APPLICANTS",`<section class="page"><header class="page-head"><div><p class="kicker">WORKFLOW / APPLICANTS</p><h2 class="page-title">신청자 통합 운영</h2><p class="desc">화면에서만 동일인을 그룹화하며 원본 Applicant·응답·사진·링크는 병합하거나 수정하지 않습니다.</p></div><button class="action" id="refresh">새로고침</button></header><section class="filters"><input id="filter-q" value="${esc(state.filters.q)}" placeholder="이름 · 연락처 · Applicant ID 검색"><select id="filter-stage"><option value="all">처리 단계 전체</option>${Object.entries(stageLabels).map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select><select id="filter-service"><option value="all">신청 서비스 전체</option><option value="matching">1:1 매칭</option><option value="social">모임</option><option value="both">둘 다 신청</option></select><select id="filter-sent"><option value="all">링크 발송 전체</option><option value="unsent">발송 전</option><option value="sent">발송 완료</option></select><select id="filter-submitted"><option value="all">2차 제출 전체</option><option value="pending">미제출</option><option value="submitted">제출 완료</option></select><select id="filter-gender"><option value="all">성별 전체</option><option value="male">남성</option><option value="female">여성</option></select><select id="filter-owner"><option value="all">담당자 전체</option>${owners.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select><select id="filter-source"><option value="all">출처 전체</option><option value="legacy">기존 Snapshot</option><option value="temporary">임시 접수</option></select><select id="filter-duplicate"><option value="all">중복 표시 전체</option><option value="yes">동일인 그룹</option><option value="no">단일 레코드</option></select></section><p class="meta" data-filter-result-count>${items.length}       function bindOpen(){document.querySelectorAll("[data-open]").forEach(b=>b.onclick=(e)=>{if(e.target.closest("[data-photo]"))return;const item=groupItems().find(i=>i.key===b.dataset.open);if(item)renderApplicant(item)});}

      async function photoUrl(item,index,purpose="thumbnail"){const base=item.photoBase,ref=base.photoRefs[index],path=typeof ref==="string"?ref:(ref?.snapshot_path||ref?.path||"");if(!path)throw new Error("PHOTO_PATH_MISSING");const data=base.kind==="legacy"?await invokeAdmin("snapshot-photo-url",{path,purpose}):await invokeAdmin("admin-photo-url",{submission_id:Number(base.subject.id),path,purpose});return data.signed_url;}

      function renderApplicant(item){state.selected=item;const p=item.profile,primaryFields=[["이름",p.name],["연락처",formatPhone(p.phone)],["출생연도",p.birthYear],["성별",p.gender==="female"?"여성":p.gender==="male"?"남성":"미확인"],["신청 서비스",serviceLabel(item.services)],["신청일",date(item.createdAt)],["직업",p.job],["학력",p.education],["직장·사업체",p.company],["지역",p.region],["키",p.height],["MBTI",p.mbti],["체형",p.bodyType],["매력 포인트",parseList(p.appealPoints).join(", ")||p.appeal],["라이프스타일",parseList(p.lifestyle).join(", ")],["유입 경로",p.journeyKey||p.entryPath],["원본 레코드",item.subjects.map(s=>`${s.type} #${s.id}`).join(" · ")]];const formsWithAnswers=item.forms.filter(f=>f.status==="submitted"||f.status==="in_progress");shell("신청자 상세","APPLICANT WORKSPACE",`<section class="page" data-temp-single-applicant-page><button class="secondary" id="back">신청자 목록</button><section class="profile-head" style="margin-top:14px"><div class="profile-photo">${photoMarkup(item)}</div><div class="profile-copy"><p class="kicker">APPLICANT · ${esc(item.canonical.type)} #${esc(item.canonical.id)}</p><h2>${esc(p.name||"이름 미입력")}</h2><p class="profile-meta">${esc(formatPhone(p.phone))} · ${esc(p.job||"직업 미입력")} · ${esc(p.region||"지역 미입력")}</p><div class="chips">${stageChip(item.stage)}<span class="chip">${esc(serviceLabel(item.services))}</span>${item.duplicate?'<span class="chip amber">화면 그룹 · 원본 유지</span>':""}</div><div class="quick-grid"><div><span>2차 링크</span><b>${item.form?.sent_at?"발송 완료":item.form?"발송 전":"미발급"}</b></div><div><span>2차 제출</span><b>${item.form?.status==="submitted"?"완료":"미완료"}</b></div><div><span>상담 상태</span><b>${esc({before:"상담전",in_progress:"상담중",completed:"상담완료"}[item.consultationStatus]||"상담전")}</b></div><div><span>다음 업무</span><b>${esc(nextTask(item))}</b></div></div><div class="workspace-controls"><select id="workflow-stage"><option value="first_review">1차 검토 중</option>${item.reviewed?.result==="approved"?'<option value="approved">승인</option>':""}${item.reviewed?.result==="hold"?'<option va       function renderMembersV2(){const items=approvedItems();shell("승인 회원","MEMBER OPERATIONS",`<section class="page"><header class="page-head"><div><p class="kicker">MEMBER OPERATIONS</p><h2 class="page-title">승인과 회원 전환을 분리합니다</h2><p class="desc">승인된 Applicant 참조만 사용하며 회원 프로필을 복제하지 않습니다. 현재 상태에서 허용된 다음 단계만 선택할 수 있습니다.</p></div></header><div class="card-grid">${items.map(i=>{const status=i.member?.member_status||"approval_pending",next=memberTransitions[status]||[];return `<article class="app-card" data-member-item="${esc(i.key)}"><div class="identity-copy"><h2>${esc(i.profile.name||"이름 미입력")}</h2><p class="meta">${esc(i.profile.gender==="male"?"남성":"여성")} · ${esc(i.profile.job||"직업 미입력")} · ${esc(i.profile.region||"지역 미입력")}</p><div class="chips" style="margin-top:8px"><span class="chip green">2차 승인</span><span class="chip">${esc(memberLabels[status])}</span></div>${next.length?`<div class="inline" style="margin-top:12px"><select data-member-status>${next.map(v=>`<option value="${v}">${esc(memberLabels[v])}</option>`).join("")}</select><input data-member-reason placeholder="상태 변경 사유 (선택)"><button class="action" data-member-save>다음 단계 저장</button><button class="secondary" data-open="${esc(i.key)}">신청자 보기</button></div>`:`<div class="inline" style="margin-top:12px"><span class="meta">추가 전이 없음</span><button class="secondary" data-open="${esc(i.key)}">신청자 보기</button></div>`}</div></article>`}).join("")||'<div class="empty">2차 승인된 신청자가 없습니다.</div>'}</div><details class="details"><summary>기존 데이터 조회 · 회원 Snapshot ${ops("member").length}건</summary><div class="panel-body"><p class="desc">기존 회원 Snapshot은 읽기 전용입니다.</p></div></details></section>`);document.querySelectorAll("[data-member-save]").forEach(b=>b.onclick=async()=>{const card=b.closest("[data-member-item]"),item=items.find(i=>i.key===card.dataset.memberItem),status=card.querySelector("[data-member-status]").value,reason=text(card.querySelector("[data-member-reason]").value);try{await invokeAdmin("admin-member-set",{subject_type:item.canonical.type,subject_id:item.canonical.id,member_status:status,reason});state.loadedAt=0;await loadAll(true);toast("회원 상태를 저장했습니다.");renderMembersV2()}catch(e){toast(`회원 상태 저장 실패 (${e.code})`,true)}});bindOpen()}
      function renderMatchingV2(){const all=groupItems(),candidates=all.filter(i=>i.reviewed?.result==="approved"&&i.member?.member_status==="matchable"),men=candidates.filter(i=>i.profile.gender==="male"),women=candidates.filter(i=>i.profile.gender==="female"),bySubject=new Map(all.flatMap(i=>i.subjects.map(s=>[`${s.type}:${s.id}`,i])));shell("1:1 매칭","MALE CHOICE FLOW",`<section class="page"><header class="page-head"><div><p class="kicker">MALE CHOICE FLOW</p><h2 class="page-title">남성 선택 방식 매칭</h2><p class="desc">2차 승인 후 회원 전환을 마치고 현재 상태가 매칭 가능인 남성과 여성만 신규 후보에 표시합니다. 여성 수락·거절 단계는 만들지 않습니다.</p></div></header><section class="panel"><div class="panel-head"><div><h2>새 후보 조합</h2><p>매칭 진행중·소개 일정 확정·일시 중단·종료 회원은 제외됩니다.</p></div><span class="chip">후보 ${candidates.length}명</span></div><div class="panel-body"><div class="split"><div class="field"><label>남성 · 매칭 가능</label><select id="match-male"><option value="">선택</option>${men.map(i=>`<option value="${esc(i.canonical.type)}:${esc(i.canonical.id)}">${esc(i.profile.name||i.canonical.id)}</option>`).join("")}</select></div><div class="field"><label>여성 후보 · 매칭 가능</label><select id="match-female"><option value="">선택</option>${women.map(i=>`<option value="${esc(i.canonical.type)}:${esc(i.canonical.id)}">${esc(i.profile.name||i.canonical.id)}</option>`).join("")}</select></div></div><label class="inline"><input type="checkbox" id="repeat-confirm" style="min-width:auto;width:18px">같은 여성 재추천 여부를 확인했습니다.</label><div class="field" style="margin-top:8px"><label>재추천·운영 사유</label><textarea id="match-reason"></textarea></div><button class="action" id="match-create" ${men.length&&women.length?"":"disabled"}>후보 조합 만들기</button></div></section><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>진행 중 매칭</h2><p>남성 검토 → 남성 수락/거절 → 일정 조율 → 만남 확정 순서입니다.</p></div><span class="chip">${state.matchingCases.length}건</span></div><div class="panel-body">${state.matchingCases.map(c=>{const man=bySubject.get(`${c.male_subject_type}:${c.male_subject_id}`),woman=bySubject.get(`${c.female_subject_type}:${c.female_subject_id}`),next=matchNext(c.status),schedule=latest(state.matchingEvents.filter(e=>e.matching_case_id===c.id&&e.scheduled_at));return `<article class="form-card" data-match="${esc(c.id)}"><div class="form-card-head"><div><h4>${esc(man?.profile.name||"남성 Applicant")} → ${esc(woman?.profile.name||"여성 Applicant")}</h4><p class="meta">${esc(matchLabels[c.status])} · ${esc(date(c.updated_at))}${schedule?` · 일정 ${esc(date(schedule.scheduled_at))}`:""}</p></div><span class="chip ${c.status==="male_rejected"?"red":c.status==="meeting_completed"?"green":"blue"}">${esc(matchLabels[c.status])}</span></div>${next.length?`<div class="inline" style="margin-top:10px"><select data-match-status>${next.map(v=>`<option value="${v}">${esc(matchLabels[v])}</option>`).join("")}</select><input data-match-date type="datetime-local"><input data-match-reason placeholder="거절 사유 또는 메모"><button class="action" data-match-save>상태 저장</button></div>`:""}</article>`}).join("")||'<p class="empty">새 시스템에서 생성한 매칭이 없습니다.</p>'}</div></section><details class="details"><summary>기존 데이터 조회 · 매칭 Snapshot ${ops("match").length}건</summary><div class="panel-body"><p class="desc">기존 매칭과 피드백은 읽기 전용입니다.</p></div></details></section>`);document.getElementById("match-create").onclick=async()=>{const male=document.getElementById("match-male").value.split(":"),female=document.getElementById("match-female").value.split(":"),reason=text(document.getElementById("match-reason").value);if(male.length<2||female.length<2){toast("매칭 가능한 남성과 여성 후보를 모두 선택해 주세요.",true);return}try{await invokeAdmin("admin-match-create",{male_subject_type:male[0],male_subject_id:male.slice(1).join(":"),female_subject_type:female[0],female_subject_id:female.slice(1).join(":"),repeat_confirmed:document.getElementById("repeat-confirm").checked,reason});state.loadedAt=0;await loadAll(true);toast("매칭 후보를 만들었습니다.");renderMatchingV2()}catch(e){toast(`매칭 생성 실패 (${e.code})`,true)}};document.querySelectorAll("[data-match-save]").forEach(b=>b.onclick=async()=>{const card=b.closest("[data-match]"),status=card.querySelector("[data-match-status]").value,reason=text(card.querySelector("[data-match-reason]").value),value=card.querySelector("[data-match-date]").value;try{await invokeAdmin("admin-match-transition",{matching_case_id:card.dataset.match,status,reason,scheduled_at:value?new Date(value).toISOString():null});state.loadedAt=0;await loadAll(true);renderMatchingV2()}catch(e){toast(`상태 저장 실패 (${e.code})`,true)}})}
      function socialEventFee(event){const value=event?.participationFee??event?.participation_fee??event?.fee??event?.price??event?.ticketPrice??event?.ticket_price;if(value===null||value===undefined||value==="")return"참가비 미등록";if(typeof value==="number")return`${value.toLocaleString("ko-KR")}원`;const raw=text(value);return /원|무료/.test(raw)?raw:`${raw}원`}
      function renderSocialV2(){const items=groupItems().filter(i=>["social","both"].includes(i.services)),events=ops("social_event"),existing=ops("social_participant");shell("모임 신청 현황","EVENT OPERATIONS",`<section class="page"><header class="page-head"><div><p class="kicker">EVENT OPERATIONS</p><h2 class="page-title">실제 Event 기준 모임 운영</h2><p class="desc">외부 결제 연동 없이 입금 확인 후 결제 완료를 수동 저장합니다. 결제 개인정보는 저장하지 않습니다.</p></div></header><div class="metrics">${events.map(e=>`<article class="metric"><p>${esc(e.title||"모임")}</p><b>${items.filter(i=>resolveSocial(i,events)?._sourceId===e._sourceId).length}</b><small>${esc(date(e.startsAt))} · ${esc(e.location||"장소 미정")} · ${esc(socialEventFee(e))}</small></article>`).join("")||'<article class="metric"><p>활성 Event</p><b>0</b><small>Snapshot에서 불러옵니다.</small></article>'}</div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>모임 신청자</h2><p>신청 → 검토 → 선정/대기 → 결제 대기 → 결제 완료 → 참석 확정 순서입니다.</p></div><span class="chip">${items.length}명</span></div><div class="panel-body">${items.map(i=>{const resolved=resolveSocial(i,events),subjectKeys=new Set(i.subjects.map(s=>`${s.type}:${s.id}`)),latestState=latest(state.socialEvents.filter(e=>subjectKeys.has(`${e.subject_type}:${e.subject_id}`)&&(!resolved||String(e.social_event_id)===String(resolved._sourceId)))),status=latestState?.status||"applied",next=socialTransitions[status]||[];return `<article class="form-card" data-social-item="${esc(i.key)}"><div class="form-card-head"><div><h4>${esc(i.profile.name||"이름 미입력")}</h4><p class="meta">${resolved?`${esc(resolved.title)} · ${esc(date(resolved.startsAt))} · ${esc(socialEventFee(resolved))}`:i.socialSelection.intent==="next_event"?"다음 모임 희망":"Event 미지정"}</p></div><span class="chip ${["paid","confirmed","attended"].includes(status)?"green":status==="cancelled"||status==="no_show"?"red":"blue"}">${esc(socialLabels[status])}</span></div><div class="inline" style="margin-top:10px"><select data-social-event><option value="">실제 Event 선택</option>${events.map(e=>`<option value="${esc(e._sourceId)}" ${resolved?._sourceId===e._sourceId?"selected":""}>${esc(e.title)} · ${esc(dateOnly(e.startsAt))} · ${esc(socialEventFee(e))}</option>`).join("")}</select>${next.length?`<select data-social-status>${next.map(v=>`<option value="${v}">${esc(socialLabels[v])}</option>`).join("")}</select><input data-social-reason placeholder="취소·불참 사유 또는 운영 메모"><button class="action" data-social-save>${next.includes("paid")?"상태 저장 · 입금 확인":"상태 저장"}</button>`:'<span class="meta">처리 완료</span>'}<button class="secondary" data-open="${esc(i.key)}">신청자 보기</button></div></article>`}).join("")||'<p class="empty">모임 신청자가 없습니다.</p>'}</div></section><details class="details"><summary>기존 데이터 조회 · 참여자 Snapshot ${existing.length}건 · 이전 운영 이력 ${state.legacySocialEvents.length}건</summary><div class="panel-body"><p class="desc">기존 참여자 Snapshot과 이전 운영 event는 읽기 전용입니다.</p></div></details></section>`);document.querySelectorAll("[data-social-save]").forEach(b=>b.onclick=async()=>{const card=b.closest("[data-social-item]"),item=items.find(i=>i.key===card.dataset.socialItem),eventId=card.querySelector("[data-social-event]").value,status=card.querySelector("[data-social-status]").value,reason=text(card.querySelector("[data-social-reason]").value);if(!eventId){toast("실제 Event를 선택해 주세요.",true);return}if(["cancelled","no_show"].includes(status)&&!reason){toast("취소·불참 사유를 입력해 주세요.",true);return}try{await invokeAdmin("admin-social-status-set",{social_event_id:eventId,subject_type:item.canonical.type,subject_id:item.canonical.id,status,reason});state.loadedAt=0;await loadAll(true);toast(status==="paid"?"입금 확인을 저장했습니다.":"모임 상태를 저장했습니다.");renderSocialV2()}catch(e){toast(`모임 상태 저장 실패 (${e.code})`,true)}});bindOpen()}
      (async()=>{if(readSession()){await recordLogin();await navigate("dashboard")}else login()})();
    </script>
