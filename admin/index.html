<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>IRUM OS · 임시 접수 운영</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Pretendard:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #16233c;
        --ink: #18202e;
        --muted: #6e7785;
        --line: #e6e9ef;
        --bg: #f6f7f9;
        --gold: #c59c2a;
        --gold-soft: #fff9e8;
        --ok: #15704d;
        --warn: #a56700;
        --danger: #b54747;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Pretendard, Manrope, sans-serif;
        font-size: 14px;
      }
      .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .login-card {
        width: min(100%, 430px);
        padding: 38px;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 25px 70px rgba(22, 35, 60, 0.12);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        color: var(--navy);
        font:
          700 18px Manrope,
          sans-serif;
        letter-spacing: -0.04em;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: #fff;
        font:
          500 11px "DM Mono",
          monospace;
      }
      .login h1 {
        margin: 32px 0 8px;
        font-size: 26px;
        letter-spacing: -0.05em;
      }
      .login p {
        margin: 0 0 26px;
        color: var(--muted);
        line-height: 1.65;
      }
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 15px;
      }
      .field label {
        font-size: 12px;
        font-weight: 700;
        color: #424b5a;
      }
      .field input {
        height: 46px;
        border: 1px solid #d9dee8;
        padding: 0 13px;
        outline: none;
        font: inherit;
      }
      .field input:focus {
        border-color: var(--navy);
        box-shadow: 0 0 0 3px rgba(22, 35, 60, 0.09);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .primary {
        height: 47px;
        width: 100%;
        border: 0;
        background: var(--navy);
        color: #fff;
        font-weight: 700;
      }
      .primary:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .login-error {
        min-height: 18px;
        color: var(--danger);
        font-size: 12px;
        margin: 10px 0;
      }
      .login-helper { margin-top:16px; color:#6e6b63; font-size:12px; line-height:1.6; }
      .link-button { display:inline; padding:0; border:0; background:transparent; color:#8a6c1d; font:inherit; font-weight:700; text-decoration:underline; cursor:pointer; }
      .layout {
        display: grid;
        grid-template-columns: 242px minmax(0, 1fr);
        min-height: 100vh;
      }
      .side {
        padding: 22px 15px;
        background: #fff;
        border-right: 1px solid var(--line);
      }
      .side .brand {
        padding: 0 8px 28px;
      }
      .menu-label {
        margin: 19px 8px 8px;
        color: #9aa3b0;
        font:
          500 10px "DM Mono",
          monospace;
        letter-spacing: 0.12em;
      }
      .menu {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 11px 10px;
        border: 0;
        background: transparent;
        color: #5e6877;
        text-align: left;
      }
      .menu.active {
        background: #eef1f6;
        color: var(--navy);
        font-weight: 700;
      }
      .menu i {
        font-style: normal;
        color: var(--gold);
      }
      .main {
        min-width: 0;
      }
      .top {
        height: 70px;
        padding: 0 34px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title small {
        display: block;
        color: #8992a0;
        font:
          500 10px "DM Mono",
          monospace;
        letter-spacing: 0.11em;
      }
      .title h1 {
        margin: 3px 0 0;
        font-size: 18px;
        letter-spacing: -0.04em;
      }
      .operator {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #5d6675;
        font-size: 12px;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #e9edf2;
        color: var(--navy);
        font-weight: 700;
      }
      .content {
        padding: 30px 34px 56px;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 13px;
        margin-bottom: 22px;
      }
      .stat {
        padding: 18px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .stat span {
        display: block;
        color: #8992a0;
        font-size: 11px;
        font-weight: 700;
      }
      .stat b {
        display: block;
        margin-top: 8px;
        font:
          600 24px Manrope,
          sans-serif;
        letter-spacing: -0.06em;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }
      .search {
        flex: 1;
        max-width: 360px;
        height: 43px;
        border: 1px solid var(--line);
        padding: 0 13px;
        background: #fff;
        outline: 0;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        background: #fff;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        min-width: 840px;
      }
      .table th {
        padding: 12px 15px;
        background: #fafbfd;
        border-bottom: 1px solid var(--line);
        color: #84909f;
        text-align: left;
        font-size: 11px;
      }
      .table td {
        padding: 15px;
        border-bottom: 1px solid #eef0f4;
        vertical-align: middle;
      }
      .table tr {
        cursor: pointer;
      }
      .table tr:hover {
        background: #fafbfd;
      }
      .name {
        font-weight: 700;
      }
      .sub {
        margin-top: 4px;
        color: #7b8593;
        font-size: 12px;
      }
      .badge {
        display: inline-flex;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
      }
      .badge.matching {
        background: #edf2fb;
        color: #315c9f;
      }
      .badge.social {
        background: #f8f0fa;
        color: #84478d;
      }
      .badge.consent {
        background: #edf8f1;
        color: var(--ok);
      }
      .badge.snapshot {
        background: #fff5d7;
        color: #7a5700;
      }
      .empty {
        padding: 54px 24px;
        text-align: center;
        color: #7a8492;
      }
      .drawer {
        position: fixed;
        inset: 0 0 0 auto;
        width: min(100%, 520px);
        background: #fff;
        box-shadow: -18px 0 50px rgba(20, 26, 37, 0.14);
        transform: translateX(105%);
        transition: transform 0.2s ease;
        z-index: 5;
        overflow: auto;
      }
      .drawer.open {
        transform: translateX(0);
      }
      .drawer-top {
        position: sticky;
        top: 0;
        background: #fff;
        padding: 20px 25px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .drawer-body {
        padding: 26px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 125px 1fr;
        gap: 0;
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
        margin-top: 18px;
      }
      .detail-grid div {
        min-height: 46px;
        padding: 12px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        word-break: break-word;
      }
      .detail-grid div:nth-child(odd) {
        background: #fafbfd;
        color: #77818f;
        font-size: 12px;
        font-weight: 700;
      }
      .photo-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 11px;
        margin-top: 14px;
      }
      .photo {
        padding: 12px;
        border: 1px solid var(--line);
        font-size: 12px;
        color: #5e6877;
      }
      .photo button {
        margin-top: 8px;
        border: 1px solid #d4dae3;
        background: #fff;
        padding: 7px 9px;
        font-size: 11px;
      }
      .notice {
        padding: 13px 15px;
        background: var(--gold-soft);
        border: 1px solid #f0dfa7;
        color: #80611c;
        font-size: 12px;
        line-height: 1.6;
      }
      @media (max-width: 760px) {
        .layout {
          display: block;
        }
        .side {
          display: none;
        }
        .top {
          padding: 0 18px;
        }
        .content {
          padding: 21px 16px;
        }
        .stat-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .toolbar {
          display: block;
        }
        .search {
          max-width: none;
          width: 100%;
          margin-bottom: 10px;
        }
        .drawer {
          width: 100%;
        }
      }

      /* IRUM OS visual parity layer: the temporary console keeps the original information architecture,
         while only exposing the safe temporary intake and read-only Snapshot actions. */
      body { background:#f6f6f2; color:#24221f; font-family:Pretendard,Arial,sans-serif; }
      .layout { grid-template-columns:248px minmax(0,1fr); background:#f6f6f2; }
      .side { position:sticky; top:0; height:100vh; padding:0 0 14px; overflow:auto; background:#171614; border:0; color:#fff; }
      .side .brand { height:72px; padding:0 19px; gap:12px; border-bottom:1px solid rgba(255,255,255,.1); color:#fff; font-size:14px; font-weight:700; }
      .side .brand small { display:block; margin-bottom:2px; color:#c59c2a; font:700 10px "DM Mono",monospace; letter-spacing:.18em; }
      .brand-mark { width:30px; height:30px; border-radius:0; background:#c59c2a; color:#171614; font-weight:700; }
      .menu-label { margin:22px 0 7px; padding:0 16px; color:rgba(255,255,255,.38); font:600 10px "DM Mono",monospace; letter-spacing:.14em; }
      .menu { min-height:40px; gap:12px; padding:0 16px; border-left:2px solid transparent; color:rgba(255,255,255,.62); font-size:13px; transition:background .16s,color .16s; }
      .menu:hover { background:rgba(255,255,255,.06); color:#fff; }
      .menu.active { border-left-color:#c59c2a; background:rgba(255,255,255,.09); color:#f2cc68; font-weight:700; }
      .menu i { width:14px; color:inherit; font-size:12px; }
      .nav-scope { margin-left:auto; border:1px solid rgba(255,255,255,.18); padding:2px 5px; color:rgba(255,255,255,.53); font-size:9px; font-weight:700; }
      .main { background:#f6f6f2; }
      .top { position:sticky; top:0; z-index:3; height:72px; padding:0 28px; border-bottom:1px solid #e5e2da; background:rgba(253,252,249,.96); backdrop-filter:blur(12px); }
      .title small { color:#a37d1d; font:600 10px "DM Mono",monospace; letter-spacing:.14em; }
      .title h1 { color:#25221e; font-size:19px; font-weight:700; }
      .operator { color:#817b70; }
      .avatar { background:#c59c2a; color:#171614; }
      .content { max-width:1500px; padding:28px 30px 56px; }
      .notice { margin-bottom:20px; border:1px solid #e8ddbd; background:#fffaf0; color:#69531d; }
      .stat-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
      .stat { min-height:108px; padding:18px; border:1px solid #e5e2da; background:#fff; box-shadow:0 1px 1px rgba(35,31,25,.02); }
      .stat span { color:#837c70; font-size:11px; }
      .stat b { color:#2a2722; font-size:26px; }
      .toolbar { align-items:center; margin:24px 0 12px; }
      .search { height:42px; border-color:#dedad0; background:#fff; }
      .search:focus { border-color:#b48a20; box-shadow:0 0 0 3px rgba(197,156,42,.14); }
      .table-wrap { border-color:#e5e2da; box-shadow:0 1px 1px rgba(35,31,25,.02); }
      .table { min-width:850px; }
      .table th { background:#fbfaf7; border-color:#ece8df; color:#8b8478; font-weight:700; }
      .table td { border-color:#f0ede7; color:#3c3832; }
      .table tr:hover { background:#fffcf6; }
      .badge { border-radius:999px; padding:4px 8px; }
      .drawer { width:min(100%,590px); box-shadow:-18px 0 56px rgba(20,18,14,.2); }
      .drawer-top { border-color:#e5e2da; background:#fdfcf9; }
      .drawer-body { padding:28px; }
      .detail-grid { border-color:#e5e2da; }
      .detail-grid div { border-color:#e5e2da; }
      .detail-grid div:nth-child(odd) { background:#fbfaf7; color:#777064; }
      .photo { border-color:#e5e2da; background:#fbfaf7; }
      .consultation-panel { margin-top:24px; border-top:1px solid #e5e2da; padding-top:20px; }
      .consultation-panel h3 { margin:0 0 6px; color:#27231e; font-size:15px; }
      .consultation-help { margin:0 0 14px; color:#847c70; font-size:12px; line-height:1.55; }
      .consultation-form { display:grid; gap:10px; padding:15px; border:1px solid #e5e2da; background:#fbfaf7; }
      .consultation-form textarea { min-height:100px; width:100%; resize:vertical; border:1px solid #dcd7cd; padding:11px; font:inherit; line-height:1.55; outline:0; }
      .consultation-form textarea:focus,.consultation-form select:focus,.consultation-form input:focus { border-color:#b48a20; box-shadow:0 0 0 3px rgba(197,156,42,.12); }
      .consultation-meta { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
      .consultation-meta select,.consultation-meta input { height:38px; min-width:0; border:1px solid #dcd7cd; background:#fff; padding:0 9px; font:inherit; outline:0; }
      .consultation-save { height:40px; border:0; background:#171614; color:#fff; font-size:12px; font-weight:700; }
      .consultation-save:disabled { opacity:.55; cursor:wait; }
      .consultation-entry { padding:13px 0; border-bottom:1px solid #ece8df; }
      .consultation-entry:last-child { border-bottom:0; }
      .consultation-entry-head { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#847c70; font-size:11px; }
      .consultation-entry p { margin:8px 0 0; white-space:pre-wrap; color:#3c3832; font-size:13px; line-height:1.65; }
      .consultation-entry-action { margin-top:7px; color:#776027; font-size:11px; }
      @media (max-width:760px) { .consultation-meta { grid-template-columns:1fr; } }
      @media (max-width:760px) { .side{display:none}.layout{display:block}.top{height:64px;padding:0 18px}.content{padding:20px 16px 44px}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{min-height:94px}.drawer{width:100%} }


      /* Full IRUM OS temporary workspace layer */
      .os-page { max-width:1600px; margin:0 auto; padding:28px 30px 56px; }
      .os-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:24px; }
      .os-kicker { margin:0; color:#b38c29; font:700 10px "DM Mono",monospace; letter-spacing:.16em; }
      .os-title { margin:5px 0 0; color:#24211d; font-size:25px; letter-spacing:-.04em; }
      .os-desc { margin:7px 0 0; color:#7f786d; font-size:13px; line-height:1.55; }
      .os-action { min-height:40px; border:1px solid #1d1b18; background:#1d1b18; color:#fff; padding:0 14px; font-size:12px; font-weight:700; }
      .os-tabs { display:flex; overflow:auto; border-bottom:1px solid #ded9d0; }
      .os-tabs button { min-width:100px; border:0; border-bottom:2px solid transparent; background:transparent; padding:13px 16px; color:#80796e; font-size:13px; font-weight:700; white-space:nowrap; }
      .os-tabs button.active { border-color:#b68c27; color:#7c5a0f; }
      .os-filter { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; border:1px solid #e2ddd4; background:#fff; padding:12px; }
      .os-filter input,.os-filter select { height:40px; min-width:0; border:1px solid #ded9d0; background:#fff; padding:0 11px; color:#4a443b; font:inherit; font-size:13px; }
      .os-filter input { flex:1 1 260px; }
      .view-toggle { display:inline-flex; overflow:hidden; border:1px solid #ded9d0; }
      .view-toggle button { width:40px; border:0; background:#fff; color:#776e61; font-weight:700; }
      .view-toggle button.active { background:#29241e; color:#fff; }
      .workspace-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(315px,1fr)); gap:12px; margin-top:18px; }
      .workspace-card { overflow:hidden; border:1px solid #e2ddd4; background:#fff; cursor:pointer; text-align:left; transition:border .16s,box-shadow .16s; }
      .workspace-card:hover { border-color:#cfbf9b; box-shadow:0 4px 18px rgba(38,31,20,.08); }
      .workspace-card-main { display:grid; grid-template-columns:96px minmax(0,1fr); }
      .workspace-photo { display:grid; min-height:176px; place-items:center; background:#f2efe9; color:#8f877a; font-size:10px; font-weight:700; text-align:center; }
      button.workspace-photo { position:relative; width:100%; min-width:0; overflow:hidden; border:0; padding:0; cursor:zoom-in; }
      .workspace-photo img { width:100%; height:100%; min-height:176px; object-fit:cover; display:block; }
      .workspace-photo .photo-count { position:absolute; right:7px; bottom:7px; border:1px solid rgba(255,255,255,.32); background:rgba(25,22,18,.76); padding:4px 7px; color:#fff; font-size:10px; font-weight:800; backdrop-filter:blur(8px); }
      .workspace-photo .photo-loading { padding:12px; color:#81796d; line-height:1.5; }
      .os-profile-photo .workspace-photo { width:100%; height:100%; min-height:242px; }
      .os-profile-photo .workspace-photo img { min-height:242px; }
      .os-photo-modal { position:fixed; inset:0; z-index:400; display:grid; place-items:center; padding:24px; background:rgba(12,11,9,.92); }
      .os-photo-dialog { position:relative; display:grid; width:min(920px,100%); max-height:calc(100vh - 48px); grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; border:1px solid rgba(255,255,255,.18); background:#161410; box-shadow:0 30px 90px rgba(0,0,0,.55); }
      .os-photo-dialog header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 16px; color:#fff; }
      .os-photo-dialog header button,.os-photo-nav button { border:1px solid rgba(255,255,255,.24); background:transparent; padding:8px 11px; color:#fff; font:inherit; }
      .os-photo-stage { display:grid; min-height:260px; place-items:center; overflow:auto; background:#0c0b09; }
      .os-photo-stage img { display:block; max-width:100%; max-height:calc(100vh - 174px); object-fit:contain; }
      .os-photo-nav { display:flex; align-items:center; justify-content:center; gap:12px; padding:12px 16px; color:#fff; }
      .workspace-card-body { min-width:0; padding:13px; }
      .workspace-card-top,.workspace-card-bottom { display:flex; justify-content:space-between; gap:8px; }
      .workspace-name { overflow:hidden; margin:0; color:#2e2922; font-size:14px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
      .workspace-sub,.workspace-service { margin:5px 0 0; color:#847b6f; font-size:11px; }
      .workspace-service { color:#73561c; font-weight:700; }
      .os-chip { display:inline-flex; max-width:100%; align-items:center; border:1px solid #e4dfd6; background:#faf9f6; padding:3px 6px; color:#5d554a; font-size:10px; font-weight:700; white-space:nowrap; }
      .os-chip.progress { border-color:#d8c275; background:#fff8df; color:#6f5110; }
      .os-chip.done { border-color:#b7d5c2; background:#edf8f0; color:#2f6842; }
      .os-chip.legacy { border-color:#e4cf9b; background:#fff8e6; color:#7b5b14; }
      .os-chip.temporary { border-color:#cfdae7; background:#f3f7fb; color:#385f7b; }
      .os-chip.secondary-done { border-color:#8ebfa1; background:#e8f6ed; color:#1f633a; font-weight:800; }
      .secondary-link-card { margin-top:12px; border:1px solid #b89a50; background:#fffaf0; padding:14px; }
      .secondary-link-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
      .secondary-link-head b { display:block; color:#3b2d11; font-size:12px; }
      .secondary-link-head p { margin:4px 0 0; color:#655636; font-size:10.5px; line-height:1.55; }
      .secondary-link-status { flex:0 0 auto; border:1px solid #d6bf7d; background:#fff3cd; padding:3px 7px; color:#654a0a; font-size:10px; font-weight:800; }
      .secondary-link-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin-top:11px; }
      .secondary-link-url { width:100%; min-width:0; min-height:46px; border:1px solid #a99d89; background:#fff; padding:0 12px; color:#241f19; font:600 12px/1.4 "DM Mono",monospace; outline:0; }
      .secondary-link-url:focus { border-color:#2c2822; box-shadow:0 0 0 3px rgba(44,40,34,.12); }

          const secondary = secondaryWorkspaceState(item);
          const sentMatch = osApplicantSentStatus === "all" || (osApplicantSentStatus === "sent" ? secondary.sent : !secondary.sent);
          const submittedMatch = osApplicantSecondaryStatus === "all" || (osApplicantSecondaryStatus === "completed" ? secondary.submitted : !secondary.submitted);
          return hay.includes(osApplicantSearch.toLowerCase())
            && (osApplicantStatus === "all" || item.consultation.consultationStatus === osApplicantStatus)
            && sentMatch
            && submittedMatch;
        });
        const counts = { all:all.length, male:all.filter((item)=>item.profile.gender==="male").length, female:all.filter((item)=>item.profile.gender==="female").length };
        const listBody = osApplicantView === "card"
          ? `<section class="workspace-grid">${filtered.map(osCard).join("") || '<div class="os-muted-page">조건에 맞는 신청자가 없습니다.</div>'}</section>`
          : `<section class="os-table-wrap"><table class="os-table"><thead><tr><th>신청자</th><th>나이 · 지역</th><th>직업</th><th>신청 서비스</th><th>2차 상태</th><th>상담 상태</th><th>출처</th><th>다음 할 일</th></tr></thead><tbody>${filtered.map((item)=>`<tr data-os-workspace="${osEsc(item.key)}"><td><b>${osEsc(item.profile.name||"이름 미입력")}</b><br/><small>AP-${osEsc(item.id.padStart(8,"0"))} · ${osEsc(osFormatPhone(item.profile.phone))}</small></td><td>${osEsc(osAge(item.profile.birthYear))}세<br/><small>${osEsc(item.profile.region)}</small></td><td>${osEsc(item.profile.job)}</td><td>${osEsc(osServiceLabel(item.service))}</td><td>${osSecondaryChip(item) || '<span class="workspace-sub">발송 전 · 신청 미완료</span>'}</td><td>${osStatusChip(item.consultation.consultationStatus)}</td><td>${osSourceChip(item)}</td><td>${osEsc(item.consultation.nextAction||"담당자 배정")}</td></tr>`).join("")}</tbody></table></section>`;
        osShell("applicants","신청자 관리","자동 분류",`<section class="os-page"><header class="os-head"><div><p class="os-kicker">자동 분류</p><h2 class="os-title">신청자 관리</h2><p class="os-desc">기존 홈페이지 신청자와 신규 신청을 카드 또는 목록으로 같은 상담 기준에서 확인합니다.</p></div><button class="os-action" id="os-app-refresh">새로고침</button></header><nav class="os-tabs">${["all","male","female"].map((value)=>`<button class="${osApplicantGender===value?"active":""}" data-os-gender="${value}">${value==="all"?"전체":value==="male"?"남성":"여성"} <small>${counts[value]}</small></button>`).join("")}</nav><section class="os-filter" data-secondary-list-filters><input id="os-app-search" value="${osEsc(osApplicantSearch)}" placeholder="이름 · 연락처 · Applicant ID 검색"/><select id="os-app-status"><option value="all">상담 상태 전체</option><option value="before">상담전</option><option value="in_progress">상담중</option><option value="completed">상담완료</option></select><select id="os-app-sent-status"><option value="all">2차 링크 발송 전체</option><option value="unsent">발송 전</option><option value="sent">발송 완료</option></select><select id="os-app-secondary-status"><option value="all">2차 신청 상태 전체</option><option value="incomplete">2차 신청 미완료</option><option value="completed">2차 신청 완료</option></select><div class="view-toggle"><button class="${osApplicantView==="card"?"active":""}" data-os-view="card">▦</button><button class="${osApplicantView==="list"?"active":""}" data-os-view="list">☷</button></div></section>${listBody}</section>`);
        document.getElementById("os-app-status").value = osApplicantStatus;
        document.getElementById("os-app-sent-status").value = osApplicantSentStatus;
        document.getElementById("os-app-secondary-status").value = osApplicantSecondaryStatus;
        document.getElementById("os-app-refresh").onclick = () => osApplicants(true);
        document.getElementById("os-app-search").oninput = (event) => { osApplicantSearch=event.target.value; clearTimeout(osApplicantSearchTimer); osApplicantSearchTimer=setTimeout(()=>osApplicants(),140); };
        document.getElementById("os-app-status").onchange = (event) => { osApplicantStatus=event.target.value; osApplicants(); };
        document.getElementById("os-app-sent-status").onchange = (event) => { osApplicantSentStatus=event.target.value; osApplicants(); };
        document.getElementById("os-app-secondary-status").onchange = (event) => { osApplicantSecondaryStatus=event.target.value; osApplicants(); };
        document.querySelectorAll("[data-os-gender]").forEach((button)=>button.onclick=()=>{osApplicantGender=button.dataset.osGender;osApplicants();});
        document.querySelectorAll("[data-os-view]").forEach((button)=>button.onclick=()=>{osApplicantView=button.dataset.osView;osApplicants();});
        osBindWorkspace();
      };
      function osSingleWorkspaceSection(order, key, title, source, body) {
        return `<section class="os-section" data-temp-applicant-section="${osEsc(key)}" data-temp-section-order="${order}"><div class="os-section-head"><h3><span style="display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;background:#28231c;color:#d8ad36;font-size:11px">${order}</span>${osEsc(title)}</h3><span class="os-source">${osEsc(source)}</span></div>${body}</section>`;
      }
      function osUnifiedStaticHistory(item) {
        const notes = item.record?.snapshot?.notes || [];
        const contacts = item.record?.snapshot?.contactLogs || [];
        const rows = [
          ...notes.map((note, index) => ({ key:`note-${index}`, type:"기존 메모", content:note.content, at:note.createdAt, author:note.source || "원본 CRM" })),
          ...contacts.map((entry, index) => ({ key:`contact-${index}`, type:`연락 · ${String(entry.channel || "phone").toUpperCase()}`, content:entry.content, at:entry.contacted_at || entry.createdAt, author:"원본 CRM" })),
        ].filter((entry) => entry.content).sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0));
        return rows.length ? rows.map((entry) => `<article class="consultation-entry"><div class="consultation-entry-head"><span>${osEsc(entry.type)} · ${osEsc(osFormatDate(entry.at))}</span><span>${osEsc(entry.author)}</span></div><p>${osEsc(entry.content)}</p></article>`).join("") : '<p class="sub">기존 메모·연락 기록이 없습니다.</p>';
      }
      function osUnifiedMemoPanel(item) {
        return `<div data-temp-unified-memo><form class="consultation-form" id="os-unified-note-form"><textarea id="os-unified-note" maxlength="10000" required placeholder="상담 내용, 내부 공유사항, 다음 담당자 전달사항을 입력해 주세요."></textarea><div class="consultation-meta"><select id="os-unified-status"><option value="">상담 상태 변경 없음</option><option value="before">상담전</option><option value="in_progress">상담중</option><option value="completed">상담완료</option></select><input id="os-unified-next-action" maxlength="500" placeholder="다음 액션 (선택)"/></div><button class="consultation-save" type="submit">메모 저장</button></form><h4 style="margin:20px 0 8px">이전 기록</h4><div id="os-unified-static-history">${osUnifiedStaticHistory(item)}</div><div id="os-unified-temp-history"><p class="sub">추가 상담 기록을 불러오는 중입니다.</p></div></div>`;
      }
      function osConsultationDatePanel(item) {
        const dueAt = item.consultation?.nextActionDueAt || item.consultation?.consultationAt || "";
        const localValue = dueAt ? new Date(new Date(dueAt).getTime() - new Date(dueAt).getTimezoneOffset() * 60000).toISOString().slice(0,16) : "";
        return `<form class="consultation-form" id="os-consultation-date-form" data-temp-consultation-date><div class="consultation-meta" style="grid-template-columns:minmax(0,1fr) auto"><input id="os-consultation-date" type="datetime-local" value="${osEsc(localValue)}"/><button class="consultation-save" type="submit">상담일자 저장</button></div><p class="workspace-sub" id="os-consultation-date-current">현재 저장값 · ${osEsc(dueAt ? osFormatDate(dueAt) : "기록 없음")}</p></form>`;
      }
      async function osMountSingleWorkspaceControls(item) {
        const renderTemporaryEntries = (entries) => {
          const target = document.getElementById("os-unified-temp-history");
          if (!target) return;
          target.innerHTML = entries.length ? entries.map((entry) => `<article class="consultation-entry"><div class="consultation-entry-head"><span>${osEsc(entry.created_by_email || "임시 관리자")} · ${osEsc(formatDate(entry.created_at))}</span>${entry.consultation_status ? `<span class="badge snapshot">${osEsc(consultationStatusLabel(entry.consultation_status))}</span>` : ""}</div><p>${osEsc(entry.note_text)}</p>${entry.next_action ? `<div class="consultation-entry-action">다음 액션 · ${osEsc(entry.next_action)}${entry.next_action_due_at ? ` · ${osEsc(formatDate(entry.next_action_due_at))}` : ""}</div>` : ""}</article>`).join("") : '<p class="sub">추가 상담 기록이 없습니다.</p>';
        };
        const refresh = async () => {
          try {
            const data = await invokeAdmin("consultation-list", { subject_type:item.kind, subject_id:item.id });
            renderTemporaryEntries(data.records || []);
          } catch {
            const target = document.getElementById("os-unified-temp-history");
            if (target) target.innerHTML = '<p class="sub">상담 기록 저장소를 준비 중이거나 열람 권한이 없습니다.</p>';
          }
        };
        const noteForm = document.getElementById("os-unified-note-form");
        if (noteForm) noteForm.onsubmit = async (event) => {
          event.preventDefault();
          const button = noteForm.querySelector(".consultation-save");
          button.disabled = true;
          try {
            await invokeAdmin("consultation-add", {
              subject_type:item.kind,
              subject_id:item.id,
              note_text:document.getElementById("os-unified-note").value,
              consultation_status:document.getElementById("os-unified-status").value || null,
              next_action:document.getElementById("os-unified-next-action").value,
              next_action_due_at:null,
            });
            noteForm.reset();
            await refresh();
          } catch {
            alert("상담 기록을 저장하지 못했습니다. 로그인 상태와 임시 상담 저장소를 확인해 주세요.");
          } finally { button.disabled = false; }
        };
        const dateForm = document.getElementById("os-consultation-date-form");
        if (dateForm) dateForm.onsubmit = async (event) => {
          event.preventDefault();
          const input = document.getElementById("os-consultation-date");
          if (!input.value) return;
          const button = dateForm.querySelector(".consultation-save");
          button.disabled = true;
          try {
            await invokeAdmin("consultation-add", {
              subject_type:item.kind,
              subject_id:item.id,
              note_text:"상담일자 저장",
              consultation_status:null,
              next_action:item.consultation?.nextAction || "상담 예정",
              next_action_due_at:input.value,
            });
            document.getElementById("os-consultation-date-current").textContent = `현재 저장값 · ${formatDate(input.value)}`;
            await refresh();
          } catch {
            alert("상담일자를 저장하지 못했습니다. 로그인 상태와 임시 상담 저장소를 확인해 주세요.");
          } finally { button.disabled = false; }
        };
        await refresh();
      }
      osRenderWorkspace = async function () {
        const item = osSelectedWorkspace;
        if (!item) return;
        const p = item.profile || {};
        const photoArea = `<div class="os-profile-photo">비공개 사진<br/>${item.photoRefs.length}장<br/><button id="os-open-photo" ${item.photoRefs.length ? "" : "disabled"}>사진 보기</button></div>`;
        const header = `<section class="os-profile-head" data-temp-applicant-header>${photoArea}<div class="os-profile-copy"><p class="os-kicker">APPLICANT · AP-${osEsc(item.id.padStart(8,"0"))}</p><h2>${osEsc(p.name || "이름 미입력")}</h2><p class="os-profile-meta">${osEsc(osGenderLabel(p.gender))} · ${osEsc(osAge(p.birthYear))}세</p></div></section>`;
        const primaryFields = [["이름",p.name],["연락처",osFormatPhone(p.phone)],["출생연도",p.birthYear],["성별",osGenderLabel(p.gender)],["신청 서비스",osServiceLabel(item.service)],["신청일",osFormatDate(item.createdAt)],...(item.service === "social" ? [["모임 참석 일정",socialScheduleValue(item).label]] : []),["직업",p.job],["학력",p.education],["직장·사업체",p.company],["지역",p.region],["키",p.height],["MBTI",p.mbti],["체형",p.bodyType],["스타일·분위기",p.styleMood],["매력 포인트",osParse(p.appealPoints).join(", ")],["라이프스타일",osParse(p.lifestyle).join(", ")],["이용 목적",p.datingPurpose || p.servicePurpose],["중요 조건",p.importantConditions],["유입 경로",p.journeyKey || p.entryPath]];
        const body = header
          + osSingleWorkspaceSection(1,"primary-profile","1차 기본 프로필","신청자 입력",`<dl class="os-fields">${primaryFields.map(([label,value]) => osField(label,value)).join("")}</dl>`)
          + osSingleWorkspaceSection(2,"secondary-responses","2차 신청폼 응답","신청자 입력",'<div id="os-secondary-review"><p class="workspace-sub">2차 작성 내용을 불러오는 중입니다.</p></div>')
          + osSingleWorkspaceSection(3,"secondary-links","2차 신청폼 링크","Supabase 독립 운영",'<div id="os-secondary-profile-panel"><p class="workspace-sub">2차 신청 이력을 불러오는 중입니다.</p></div>')
          + osSingleWorkspaceSection(4,"unified-notes","통메모장","원본 기록 + 임시 운영",osUnifiedMemoPanel(item))
          + osSingleWorkspaceSection(5,"consultation-date","상담일자","Supabase append-only",osConsultationDatePanel(item));
        osShell("applicants","신청자 통합 상세","APPLICANT WORKSPACE",`<section class="os-page" data-temp-single-applicant-page><button class="menu" id="os-back-list" style="width:auto;margin-bottom:14px">← 신청자 목록</button>${body}</section>`);
        document.getElementById("os-back-list").onclick = osApplicants;
        const photoButton = document.getElementById("os-open-photo");
        if (photoButton) photoButton.onclick = () => osOpenFirstPhoto(item);
        const photoAreaNode = document.querySelector(".os-profile-photo");
        if (photoAreaNode) {
          photoAreaNode.innerHTML = osPhotoThumbMarkup(item);
          osBindPhotoThumbs(photoAreaNode);
        }
        await osMountSingleWorkspaceControls(item);
      };
      const osRenderWorkspaceWithoutSecondary = osRenderWorkspace;
      osRenderWorkspace = async function () {
        await osRenderWorkspaceWithoutSecondary();
        const item = osSelectedWorkspace;
        if (!item) return;
        await Promise.all([mountSecondaryReview(item), mountSecondaryPanel(item)]);
      };
      /* END TEMPORARY SECONDARY PROFILE PANEL */

      (async () => {
        const {
          data: { session },
        } = await client.auth.getSession();
        session ? dashboard() : login();
      })();
    </script>
  </body>
</html>
