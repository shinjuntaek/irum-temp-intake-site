<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>IRUM OS · 비밀번호 재설정</title>
    <style>
      :root{--ink:#171614;--gold:#c59c2a;--line:#e5e2da;--muted:#746e64;--danger:#b54747;--ok:#15704d}*{box-sizing:border-box}body{margin:0;background:#f6f6f2;color:var(--ink);font-family:Pretendard,Arial,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);border:1px solid var(--line);background:#fff;padding:38px;box-shadow:0 20px 55px rgba(35,31,25,.1)}.brand{display:flex;align-items:center;gap:11px;color:var(--ink);font-size:15px;font-weight:800}.mark{display:grid;place-items:center;width:29px;height:29px;background:var(--gold);font:700 11px Arial;color:#171614}.kicker{margin:27px 0 8px;color:#a37d1d;font-size:10px;font-weight:800;letter-spacing:.16em}.card h1{margin:0;font-size:25px;letter-spacing:-.05em}.card p{color:var(--muted);font-size:13px;line-height:1.65}.field{display:grid;gap:7px;margin-top:16px}.field label{font-size:12px;font-weight:700}.field input{height:46px;border:1px solid #d9d4cb;padding:0 12px;font:inherit;outline:0}.field input:focus{border-color:#b48a20;box-shadow:0 0 0 3px rgba(197,156,42,.14)}button{width:100%;height:47px;margin-top:22px;border:0;background:#171614;color:#fff;font:700 14px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{min-height:22px;margin-top:14px;color:var(--danger);font-size:12px;line-height:1.55}.message.ok{color:var(--ok)}.back{display:block;margin-top:18px;color:#8a6c1d;font-size:12px;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="shell"><section class="card"><div class="brand"><span class="mark">IO</span>IRUM OS · TEMPORARY</div><p class="kicker">PASSWORD RECOVERY</p><h1>새 비밀번호 설정</h1><p>이 링크는 이메일로 발급된 일회성 재설정 링크입니다. 새 비밀번호를 설정하면 바로 임시 관리자에 로그인할 수 있습니다.</p><form id="reset-form" hidden><div class="field"><label>새 비밀번호</label><input id="password" type="password" autocomplete="new-password" minlength="12" required /></div><div class="field"><label>새 비밀번호 확인</label><input id="password-confirm" type="password" autocomplete="new-password" minlength="12" required /></div><p class="message" id="message"></p><button id="submit" type="submit">새 비밀번호 저장</button></form><p class="message" id="state"></p><a class="back" id="login-link" href="/admin/login">로그인으로 돌아가기</a></section></main>
    <script>
      const config={url:"https://wiesmommcmwwwkwufgqg.supabase.co",key:"sb_publishable_Y_9qyDnB3KYXKllIPJq9iQ_2xyyQO9f"};
      const base=location.hostname.endsWith("github.io")?`/${location.pathname.split("/").filter(Boolean)[0]}`:"";
      document.getElementById("login-link").href=`${base}/admin/login`;
      const hash=new URLSearchParams(location.hash.slice(1));
      const accessToken=hash.get("access_token"), type=hash.get("type");
      const state=document.getElementById("state"), form=document.getElementById("reset-form");
      if(!accessToken||type!=="recovery"){state.textContent="재설정 링크가 유효하지 않거나 만료되었습니다. 로그인 화면에서 새 링크를 요청해 주세요.";}else{form.hidden=false;state.textContent="";}
      form.onsubmit=async(event)=>{event.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("password-confirm").value,message=document.getElementById("message"),button=document.getElementById("submit");if(password.length<12){message.textContent="비밀번호는 12자 이상으로 설정해 주세요.";return;}if(password!==confirm){message.textContent="새 비밀번호가 서로 일치하지 않습니다.";return;}button.disabled=true;try{const response=await fetch(`${config.url}/auth/v1/user`,{method:"PUT",headers:{"Content-Type":"application/json",apikey:config.key,Authorization:`Bearer ${accessToken}`},body:JSON.stringify({password})});if(!response.ok)throw new Error("PASSWORD_UPDATE_FAILED");message.className="message ok";message.textContent="비밀번호를 변경했습니다. 로그인 화면으로 이동합니다.";setTimeout(()=>location.href=`${base}/admin/login?reset=complete`,900);}catch{message.textContent="비밀번호를 변경하지 못했습니다. 재설정 링크를 다시 요청해 주세요.";}finally{button.disabled=false;}};
    </script>
  </body>
</html>
