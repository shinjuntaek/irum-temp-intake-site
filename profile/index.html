    function renderProfile(){const male=data.form.form_type==='profile_male';const meta=stepMeta[step-1];app.className='';app.innerHTML=`${invitation()}<main class="experience ${entryOpen?'':'ready'}" id="experience"><div class="wrap"><div class="brand"><b>IRUM</b><span>PRIVATE MATCHING CLUB</span></div><section class="hero"><div class="eyebrow">PRIVATE PROFILE</div><h1>당신의 이야기를<br/>조금 더 들려주세요.</h1><p>초대에 응답해주셔서 감사합니다. 지금부터 당신의 가치와 취향, 그리고 원하는 만남을 조금 더 깊이 알아가겠습니다.</p><span class="gender-badge">${male?'남성':'여성'} 2차 상세 프로필</span><div class="progress-meta"><strong>${String(step).padStart(2,'0')} / 05</strong><span>${meta[0]}</span></div><div class="progress">${stepMeta.map((_,i)=>`<i class="${i<step?'on':''}"></i>`).join('')}</div></section><section class="form-card"><div class="step"><div class="step-head"><div class="step-no">${String(step).padStart(2,'0')} / ${meta[0]}</div><h2>${meta[1]}</h2><p>${step===1?'1차 신청 내용은 미리 입력해두었습니다. 변경된 정보만 수정해 주세요.':step===2?'현재 직업과 경제적 정보를 확인합니다.':step===3?'서로를 자연스럽게 이해하기 위한 생활 정보입니다.':step===4?'조건보다 중요한 취향과 기준을 알려주세요.':'마지막으로 정보 이용 동의를 확인해 주세요.'}</p></div>${stepContent()}<div id="formError" class="error hide"></div><div id="saveState" class="save-state"></div><div class="footer">${step>1?'<button class="btn" data-prev>이전</button>':'<span></span>'}${step<5?'<button class="btn primary" data-next>계속하기 →</button>':'<button class="btn primary" data-submit>IRUM에 프로필 전달하기</button>'}</div></div></section><p class="security">본인에게만 발급된 만료형 개인화 링크입니다.</p></div></main>`;bind()}
    const formatDate=v=>{try{return new Date(v).toLocaleString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'numeric',minute:'2-digit'})}catch{return '일정 확인 중'}};
    function renderEvent(){const e=data.form.event_snapshot||{};app.className='';app.innerHTML=`<main><section class="event-cover ${entryOpen?'':'hide'}" id="entry"><div class="event-inner"><header class="event-brand"><div class="letter-brand"><small>premium</small><strong>이룸</strong></div><span>PRIVATE SOCIAL INVITATION</span></header><div class="invite"><div class="eyebrow">IRUM PRIVATE SOCIAL</div><h1>좋은 사람과<br/><em>좋은 분위기</em>에서,<br/>가장 자연스러운 만남을.</h1><p>IRUM이 준비한 프라이빗 모임에 초대합니다. 서로가 편안하게 대화하고, 자연스럽게 매력을 알아갈 수 있는 저녁입니다.</p><figure class="event-photo"><img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663466779538/MDXrzHwRYpKAiQIL.png" alt="IRUM 프라이빗 모임 HOST 안수빈 소개" /></figure><div class="event-meta"><div><small>EVENT</small><b>${esc(e.title||'IRUM SOCIAL')}</b></div><div><small>DATE</small><b>${esc(formatDate(e.startsAt))}</b></div><div><small>PLACE</small><b>${esc(e.location||'개별 안내')}</b></div></div><div class="event-cta"><p><b>초대받으신 분의 직업을 간단히 확인합니다.</b><br/>명함 사진 또는 PDF를 준비해 주세요. 약 1분 소요됩니다.</p><button class="cover-start" data-entry-start>모임 참가 인증하기</button></div></div></div></section><section class="event-form experience ${entryOpen?'':'ready'}" id="experience"><div class="event-panel"><div class="eyebrow">CAREER VERIFICATION · 01</div><h2>직업 인증</h2><p>직업 확인에 필요한 최소 정보만 받습니다.</p><div class="grid">${field('성함','name',{readonly:true,value:data.form.prefill.name})}${field('연락처','phone',{readonly:true,value:phone(data.form.prefill.phone)})}${field('현재 직업','job',{required:true,placeholder:'예: 의사 / 회사원 / 사업가'})}${field('회사 / 기관 / 업종','workplace',{required:true,placeholder:'예: OO병원 / OO기업'})}</div><div class="uploads">${documentBox('business_card','명함','현재 소속과 직함을 확인할 수 있는 명함 사진 또는 PDF')}</div>${consent()}<div id="formError" class="error hide"></div><div id="saveState" class="save-state"></div><button class="btn primary" style="width:100%;margin-top:20px" data-submit>인증 완료하기</button></div></section></main>`;bind()}

    function missing(targetStep=step){const type=data.form.form_type,out=[],req=(k,l)=>{if(!String(val(k)).trim())out.push({key:k,step:targetStep,label:l})};if(type==='social_event'){req('job','현재 직업');req('workplace','회사 / 기관 / 업종');if(docState('business_card')!=='verified')out.push({key:'businessCardDocument',step:1,label:'명함'});if(!val('privacyConsent'))out.push({key:'privacyConsent',step:1,label:'직업 인증 동의'});return out}if(targetStep===1){req('birthDate','생년월일');req('height','키');req('region','거주지역');req('singleStatus','현재 솔로 여부');req('maritalStatus','혼인 이력')}if(targetStep===2&&type==='profile_female'&&val('workType')==='기타')req('workTypeOther','근무 형태 직접 입력');if(targetStep===2&&type==='profile_male'){req('job','현재 직업');req('incomeMale','연소득');req('asset','개인 순자산');if(val('employment')==='기타')req('employmentOther','근무 형태 직접 입력');if(val('documentDeferred'))req('documentDueDate','서류 제출 예정일');else['job','income','asset'].forEach(t=>{if(docState(t)!=='verified')out.push({key:`${t}Document`,step:2,label:`${t==='job'?'직업':t==='income'?'연소득':'순자산'} 인증서류`})})}if(targetStep===3&&type==='profile_female'){req('realCheckMethod','실물 확인 방식');req('realCheckDate','희망 확인일')}if(targetStep===4){req('serviceSelection','원하는 서비스');if(type==='profile_male')req('purpose','만남의 목적')}if(targetStep===5&&!val('privacyConsent'))out.push({key:'privacyConsent',step:5,label:'개인정보 동의'});return out}
    const allMissing=()=>data.form.form_type==='social_event'?missing(1):[1,2,3,4,5].flatMap(targetStep=>missing(targetStep));

    const showError=message=>{const el=document.getElementById('formError');if(el){el.textContent=message;el.classList.toggle('hide',!message)}};
    const queueSave=()=>{clearTimeout(saveTimer);const el=document.getElementById('saveState');if(el)el.textContent='변경사항 저장 대기 중';saveTimer=setTimeout(saveDraft,850)};
    const saveDraft=async()=>{const el=document.getElementById('saveState');if(el)el.textContent='자동 저장 중';try{const r=await request('secondary-draft-save',{expected_revision:revision,draft_payload:form});revision=r.draft_revision;if(el)el.textContent='자동 저장 완료'}catch(e){if(el)el.textContent=e.code==='DRAFT_CONFLICT'?'다른 화면의 변경이 감지되었습니다. 새로고침해주세요.':'자동 저장에 실패했습니다.'}};
    const upload=async(type,file)=>{const err=document.querySelector(`[data-doc-error="${type}"]`);if(!file)return;if(file.size>3*1024*1024||!['application/pdf','image/jpeg','image/png','image/webp'].includes(file.type)){if(err){err.textContent='PDF, JPG, PNG, WEBP 형식의 3MB 이하 파일만 가능합니다.';err.classList.remove('hide')}return}try{const issued=await request('secondary-document-upload-url',{document_type:type,file:{name:file.name,type:file.type,size:file.size}});const put=await fetch(issued.signed_url,{method:'PUT',headers:{'Content-Type':file.type},body:file});if(!put.ok)throw new Error('업로드 실패');await request('secondary-document-complete',{document_id:issued.document_id});await load(false)}catch(e){if(err){err.textContent='파일 업로드에 실패했습니다.';err.classList.remove('hide')}}};
    const getSubmitKey=()=>{const k=`irum-temp-secondary-submit:${token.slice(0,12)}`;let v=sessionStorage.getItem(k);if(!v){v=crypto.randomUUID();sessionStorage.setItem(k,v)}return v};
    const submit=async()=>{if(submitting)return;const miss=allMissing();if(focusMissing(miss))return;submitting=true;document.querySelector('[data-submit]')?.setAttribute('disabled','');try{await request('secondary-submit',{submit_idempotency_key:getSubmitKey(),consent_version:'temporary-secondary-v2-reference',payload:form});feedback(data.form.form_type==='social_event'?'직업 인증이 완료되었습니다.':'당신의 프로필이 IRUM에 전달되었습니다.','담당 매니저가 신중하게 검토한 후 다음 절차를 안내드리겠습니다.',true)}catch(e){const remote=serverMissing(e);if(remote.length)focusMissing(remote);else if(['SUBMIT_CONFLICT','ALREADY_SUBMITTED'].includes(e.code))feedback('이미 제출이 완료되었습니다.','담당 매니저가 신중하게 검토한 후 다음 절차를 안내드리겠습니다.',true);else if(['MALE_REQUIRED_FIELDS_MISSING','FEMALE_REQUIRED_FIELDS_MISSING'].includes(e.code)){try{await load(false)}catch{}const refreshed=allMissing();if(!focusMissing(refreshed)){const female=data.form.form_type==='profile_female';step=female?3:2;renderProfile();showError(female?'실물 확인 방식과 희망 확인일을 선택해주세요. 근무 형태가 기타라면 직접 입력값도 확인해주세요.':'직업·연소득·순자산 정보와 인증서류 3종의 확인 완료 상태를 다시 확인해주세요. 서류를 추후 제출하려면 제출 예정일을 선택해주세요.')}}else{const support=String(e.code||'NETWORK').replace(/[^A-Z0-9_-]/gi,'').slice(0,48);showError(`제출하지 못했습니다. 입력 내용과 업로드 서류는 유지되어 있습니다. 지원 코드: ${support}`)}submitting=false;document.querySelector('[data-submit]')?.removeAttribute('disabled')}};
    function bind(){document.querySelector('[data-entry-start]')?.addEventListener('click',()=>{entryOpen=false;document.getElementById('entry')?.classList.add('leave');document.getElementById('experience')?.classList.add('ready');setTimeout(()=>document.getElementById('entry')?.remove(),250)});document.querySelectorAll('[data-input]').forEach(el=>el.addEventListener('input',e=>{const key=e.target.dataset.input;form[key]=e.target.value;queueSave();if(['workType','employment','education'].includes(key))renderProfile()}));document.querySelectorAll('[data-document]').forEach(el=>el.addEventListener('change',e=>upload(e.target.dataset.document,e.target.files?.[0])));document.querySelector('[data-toggle-defer]')?.addEventListener('click',()=>{form.documentDeferred=!form.documentDeferred;renderProfile();queueSave()});document.querySelector('[data-toggle-consent]')?.addEventListener('click',()=>{form.privacyConsent=!form.privacyConsent;(data.form.form_type==='social_event'?renderEvent:renderProfile)();queueSave()});document.querySelector('[data-prev]')?.addEventListener('click',()=>{showError('');step--;renderProfile();scrollTo({top:0,behavior:'smooth'})});document.querySelector('[data-next]')?.addEventListener('click',()=>{const miss=missing(step);if(focusMissing(miss))return;step++;renderProfile();scrollTo({top:0,behavior:'smooth'})});document.querySelector('[data-submit]')?.addEventListener('click',submit)}
    const feedback=(title,description,success=false)=>{app.className='feedback';app.innerHTML=`<section class="feedback-card"><div style="font-family:Georgia,serif;font-size:24px;color:${success?'#e7c96e':'#aaa'}">${success?'I':'◇'}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></section>`};
    async function load(resetEntry=true){if(!/^[A-Za-z0-9_-]{40,100}$/.test(token)){feedback('유효하지 않은 링크입니다.','담당자에게 개인화 2차 신청 링크를 요청해주세요.');return}try{data=await request('secondary-public-get');revision=data.form.draft_revision||0;const prefill=canonicalChoices(normalizeLegacy(data.form.prefill||{})),draft=canonicalChoices(normalizeLegacy(data.form.draft_payload||{}));form={...prefill,...draft,name:prefill.name||'',phone:prefill.phone||'',healthFlag:draft.healthFlag||'',healthMemo:draft.healthMemo||'',privacyConsent:false};if(resetEntry){entryOpen=!new URLSearchParams(location.search).has('start')}data.form.form_type==='social_event'?renderEvent():renderProfile()}catch(e){feedback(e.code==='LINK_EXPIRED'?'이 링크는 사용기간이 만료되었습니다.':'접근할 수 없는 링크입니다.','링크를 확인하거나 담당자에게 문의해주세요.')}}
    load();
  </script>
</body>
</html>
