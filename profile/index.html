<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>IRUM | 개인화 2차 신청</title>
  <style>
    :root{--ink:#241f19;--paper:#f2efe9;--card:#fbf9f5;--line:#d8d0c5;--gold:#c9a64d;--dark:#11100e;--muted:#756d62;--danger:#963f36;--green:#315f42}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}.hidden{display:none!important}
    .loading,.feedback{min-height:100vh;display:grid;place-items:center;background:#0e0b07;color:#fff;padding:20px}.feedback-card{width:min(100%,430px);border:1px solid rgba(255,255,255,.15);padding:34px;text-align:center;background:rgba(255,255,255,.025)}.feedback h1{font-size:21px;margin:18px 0 8px}.feedback p{font-size:14px;line-height:1.7;color:rgba(255,255,255,.58)}
    .spinner{width:32px;height:32px;border:3px solid rgba(197,156,42,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .wrap{width:min(100%,780px);margin:auto;padding:20px 12px 40px}.hero{border:1px solid var(--line);background:var(--dark);color:#f4efe6;padding:28px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.2em;color:#d1af5a}.hero h1{font-family:Georgia,serif;font-size:clamp(29px,7vw,43px);font-weight:400;letter-spacing:-.04em;margin:12px 0}.hero p{font-size:13px;line-height:1.75;color:rgba(255,255,255,.62);margin:0}.progress{height:4px;margin-top:24px;background:rgba(255,255,255,.1)}.progress>i{display:block;height:100%;background:var(--gold);transition:width .2s}.step-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:10px}.step-labels span{text-align:center;font-size:9px;color:rgba(255,255,255,.35)}.step-labels .on{color:#f0d487;font-weight:700}
    .panel{border:1px solid var(--line);border-top:0;background:var(--card);padding:24px}.panel-head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #ddd5ca;padding-bottom:16px;margin-bottom:24px}.panel-head small{font-size:9px;font-weight:800;letter-spacing:.18em;color:#9b7626}.panel-head h2{font-family:Georgia,serif;font-weight:400;font-size:26px;margin:5px 0 0}.tag{border:1px solid #d5cbbb;padding:5px 8px;font-size:10px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.full{grid-column:1/-1}.field{display:block}.field>span{display:block;margin-bottom:8px;font-size:12px;font-weight:700;color:#3f382f}.req{color:#9b463c;margin-left:3px}.input{width:100%;min-height:48px;border:1px solid #cfc6ba;background:#fff;padding:10px 12px;font-size:15px;color:var(--ink);outline:none}.input:focus{border-color:#24211c;box-shadow:0 0 0 2px rgba(197,156,42,.15)}.input[readonly]{background:#f0ece5;color:#7d7469}.textarea{min-height:110px;resize:vertical}.hint{display:block;margin-top:6px;font-size:11px;line-height:1.5;color:#81786d}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{min-height:44px;border:1px solid #d8d0c5;background:#fff;color:#5d554b;padding:10px 12px;text-align:left;font-size:12px;font-weight:700}.choice.on{border-color:#26211b;background:#26211b;color:#fff}.docs{display:grid;gap:12px;margin-top:18px}.doc{border:1px solid #d9d1c6;background:#f8f5ef;padding:15px}.doc-top{display:flex;justify-content:space-between;gap:10px}.doc b{font-size:14px}.doc p{font-size:11px;color:#81786d;margin:5px 0 0}.doc-state{font-size:12px;color:var(--green);font-weight:700}.file-btn{display:inline-flex;align-items:center;min-height:40px;border:1px solid #a79a88;background:#fff;padding:8px 12px;margin-top:12px;font-size:12px;font-weight:700}.file-btn input{display:none}.consent{display:flex;align-items:flex-start;gap:12px;width:100%;border:1px solid var(--line);background:#fff;padding:15px;text-align:left;color:var(--ink)}.consent.on{border-color:var(--green);background:#eef6f0}.check{width:20px;height:20px;flex:0 0 20px;border:1px solid #91877a;display:grid;place-items:center}.consent.on .check{background:var(--green);border-color:var(--green);color:#fff}.consent b{font-size:14px}.consent em{display:block;font-style:normal;margin-top:5px;font-size:12px;line-height:1.6;color:#756d62}.notice{border:1px solid #d6c490;background:#fff9e9;padding:14px;font-size:13px;line-height:1.7;color:#5d5237}.error{margin-top:18px;border:1px solid #d6a89f;background:#fff1ee;padding:12px;font-size:12px;line-height:1.6;color:var(--danger)}.save-state{min-height:20px;margin:14px 0 0;text-align:right;font-size:11px;color:#81786d}.nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ddd5ca;margin-top:24px;padding-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:45px;border:0;padding:10px 18px;font-size:14px;font-weight:800}.btn-dark{background:#24211c;color:#fff}.btn-light{border:1px solid #cfc6ba;background:#fff;color:#241f19}.security{text-align:center;margin-top:14px;font-size:11px;color:#766e63}
    .event-cover{min-height:76vh;background:radial-gradient(circle at 75% 20%,rgba(197,156,42,.25),transparent 35%),linear-gradient(155deg,#191816,#080808 58%,#16120d);color:#f2eee6;padding:28px 16px;display:flex}.event-inner{width:min(100%,760px);margin:auto}.event-brand{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:18px}.event-brand b{font-family:Georgia,serif;letter-spacing:.16em}.event-brand span{font-size:8px;letter-spacing:.18em;color:rgba(255,255,255,.45)}.invite{border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);padding:30px;margin-top:50px}.invite h1{font-family:Georgia,serif;font-size:clamp(48px,14vw,76px);font-weight:400;line-height:.9;letter-spacing:-.05em;margin:20px 0}.invite>p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.58)}.event-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.15);margin-top:25px}.event-meta div{background:#0d0d0c;padding:14px}.event-meta small{font-size:8px;letter-spacing:.14em;color:rgba(255,255,255,.42)}.event-meta b{display:block;margin-top:8px;font-size:13px}.host{border-left:1px solid var(--gold);padding-left:14px;margin-top:22px}.host small{font-size:8px;letter-spacing:.18em;color:rgba(255,255,255,.42)}.host b{display:block;font-family:Georgia,serif;font-size:24px;margin-top:5px}.event-form{width:min(100%,680px);margin:auto;padding:24px 12px 50px}.event-panel{border:1px solid var(--line);background:#faf8f4;padding:24px}.event-panel h2{font-family:Georgia,serif;font-size:32px;font-weight:400;margin:10px 0}.event-panel>p{font-size:13px;line-height:1.7;color:var(--muted)}
    @media(max-width:620px){.wrap{padding:0 0 28px}.hero,.panel{border-left:0;border-right:0}.hero{padding:24px 18px}.panel{padding:20px 15px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.choices{grid-template-columns:1fr}.step-labels span{font-size:8px}.event-meta{grid-template-columns:1fr}.invite{padding:24px 18px;margin-top:35px}.event-panel{padding:20px 15px}.nav{position:sticky;bottom:0;background:rgba(251,249,245,.97);padding:12px 0 2px;z-index:5}}
  </style>
</head>
<body>
  <div id="app" class="loading"><div class="spinner" aria-label="불러오는 중"></div></div>
  <script>
    const CONFIG={endpoint:'https://wiesmommcmwwwkwufgqg.supabase.co/functions/v1/temporary-secondary-profile',key:'sb_publishable_Y_9qyDnB3KYXKllIPJq9iQ_2xyyQO9f'};
    const token=decodeURIComponent(location.hash.slice(1));
    const app=document.getElementById('app');
    const steps=['기본 정보','직업·배경','생활 정보','만남 조건','최종 확인'];
    let data=null,form={},step=1,revision=0,saveTimer=null,submitting=false;
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const phone=v=>{const d=String(v??'').replace(/\D/g,'').slice(0,11);return d.length<=3?d:d.length<=7?`${d.slice(0,3)}-${d.slice(3)}`:`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`};
    const request=async(action,body={})=>{const r=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json',apikey:CONFIG.key,Authorization:`Bearer ${CONFIG.key}`},body:JSON.stringify({action,token,...body})});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'요청을 처리하지 못했습니다.');e.code=j.error;e.status=r.status;e.data=j;throw e}return j};
    const getSubmitKey=()=>{const k=`irum-temp-secondary-submit:${token.slice(0,12)}`;let v=sessionStorage.getItem(k);if(!v){v=crypto.randomUUID();sessionStorage.setItem(k,v)}return v};
    const val=k=>form[k]??'';
    const input=(label,key,opts={})=>`<label class="field ${opts.full?'full':''}"><span>${label}${opts.required?'<i class="req">*</i>':''}</span><input class="input" data-input="${key}" ${opts.type?`type="${opts.type}"`:''} ${opts.readonly?'readonly':''} value="${esc(opts.value??val(key))}" placeholder="${esc(opts.placeholder||'')}" />${opts.hint?`<small class="hint">${opts.hint}</small>`:''}</label>`;
    const textarea=(label,key,required=false)=>`<label class="field full"><span>${label}${required?'<i class="req">*</i>':''}</span><textarea class="input textarea" data-input="${key}">${esc(val(key))}</textarea></label>`;
    const choices=(label,key,options,required=false)=>`<div class="field"><span>${label}${required?'<i class="req">*</i>':''}</span><div class="choices">${options.map(o=>`<button type="button" class="choice ${val(key)===o[0]?'on':''}" data-choice="${key}" data-value="${esc(o[0])}">${esc(o[1])}</button>`).join('')}</div></div>`;
    const docState=type=>(data.form.documents||[]).find(d=>d.document_type===type)?.status;
    const documentBox=(type,label)=>{const state=docState(type);return `<div class="doc"><div class="doc-top"><div><b>${label}</b><p>PDF·JPG·PNG·WebP · 최대 3MB</p></div>${state==='verified'?'<span class="doc-state">업로드 완료</span>':''}</div><label class="file-btn">${state==='verified'?'파일 교체':'파일 선택'}<input type="file" data-document="${type}" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp" /></label><div class="error hidden" data-doc-error="${type}"></div></div>`};
    const consent=()=>`<button type="button" class="consent ${val('privacyConsent')?'on':''}" data-toggle-consent><span class="check">${val('privacyConsent')?'✓':''}</span><span><b>[필수] 2차 프로필 정보 활용에 동의합니다.</b><em>입력한 정보는 이룸의 심사·매칭·모임 운영을 위해서만 사용됩니다.</em></span></button>`;
    const profileStep=()=>{const male=data.form.form_type==='profile_male';if(step===1)return `<div class="grid">${input('이름','name',{readonly:true,value:data.form.prefill.name})}${input('연락처','phone',{readonly:true,value:phone(data.form.prefill.phone)})}${input('키','height',{required:true,placeholder:'예: 175cm'})}${input('거주 지역','region',{required:true,placeholder:'예: 서울 강남'})}${choices('현재 솔로 여부','singleStatus',[['single','현재 솔로입니다'],['other','기타']],true)}${choices('혼인 상태','maritalStatus',[['single','미혼'],['divorced','이혼'],['widowed','사별']],true)}${choices('결혼 의향','marriageIntention',[['serious','진지하게 고려'],['open','좋은 인연이면 고려'],['slow','천천히 알아가고 싶음']],true)}</div>`;
      if(step===2&&!male)return `<div class="grid">${choices('실물 확인 방식','realCheck',[['video','영상 통화'],['in_person','대면 확인']],true)}${input('직업','job')}${input('회사·업종','companyIndustry')}${input('근무 형태','workType')}${input('연소득 구간','incomeFemale')}${input('학교','school')}${input('전공','major')}</div>`;
      if(step===2&&male)return `<div class="grid">${input('현재 직업','job',{required:true})}${input('고용 형태','employment')}${input('회사·사업체','company')}${input('직책','position')}${input('연소득','incomeMale',{required:true})}${input('개인 순자산','asset',{required:true})}</div><div class="docs">${documentBox('job','직업 인증서류')}${documentBox('income','소득 인증서류')}${documentBox('asset','자산 인증서류')}</div><button type="button" class="consent ${val('documentDeferred')?'on':''}" data-toggle-deferred><span class="check">${val('documentDeferred')?'✓':''}</span><span><b>인증서류를 추후 제출하겠습니다.</b><em>선택 시 제출 예정일을 반드시 입력해주세요.</em></span></button>${val('documentDeferred')?`<div style="margin-top:15px">${input('서류 제출 예정일','documentDueDate',{type:'date',required:true})}</div>`:''}`;
      if(step===3)return `<div class="grid">${input('주거 형태','housing')}${input('차량','car')}${choices('타투','tattoo',[['none','없음'],['yes','있음']])}${choices('건강 관련 안내','healthFlag',[['none','없음'],['yes','있음']])}${val('healthFlag')==='yes'?textarea('건강 관련 상세','healthMemo',true):''}${!male?textarea('추가로 전하고 싶은 내용','femaleNote'):''}</div>`;
      if(step===4)return `<div class="grid">${choices('원하는 서비스',male?'serviceMale':'serviceFemale',male?[['matching','1:1 매칭'],['social','프라이빗 모임'],['both','둘 다']]:[['matching','1:1 매칭'],['meeting','소규모 미팅'],['both','둘 다']],true)}${male?choices('만남의 목적','purpose',[['dating','연애'],['marriage','결혼을 전제로 한 만남'],['open','좋은 인연부터']],true):''}${male?input('선호 최소 연령','preferredAgeMin',{type:'number'}):''}${male?input('선호 최대 연령','preferredAgeMax',{type:'number'}):''}${male?input('선호 최소 키','preferredHeightMin',{type:'number'}):''}${male?input('선호 최대 키','preferredHeightMax',{type:'number'}):''}${male?input('상대 결혼 의향','targetMarriage'):''}${male?input('상대 흡연','targetSmoking'):''}${male?input('상대 타투','targetTattoo'):''}</div>`;
      return `<div class="notice">제출한 정보는 기존 Applicant의 동일 인물 이력에 연결되며 별도의 중복 Applicant를 만들지 않습니다. 민감 서류는 관리자 권한으로만 확인할 수 있습니다.</div><div style="margin-top:18px">${consent()}</div>`};
    const renderProfile=()=>{const type=data.form.form_type;const male=type==='profile_male';app.className='';app.innerHTML=`<main class="wrap"><header class="hero"><div class="eyebrow">IRUM · PRIVATE PROFILE BOOK</div><h1>${esc(data.form.prefill.name)}님을 위한 2차 프로필</h1><p>1차 신청에 이어 필요한 정보를 단계별로 확인합니다. 각 단계의 필수 항목을 입력해야 다음으로 이동할 수 있습니다.</p><div class="progress"><i style="width:${step*20}%"></i></div><div class="step-labels">${steps.map((s,i)=>`<span class="${i+1===step?'on':''}">${i+1}. ${s}</span>`).join('')}</div></header><section class="panel"><div class="panel-head"><div><small>STEP ${step}</small><h2>${steps[step-1]}</h2></div><span class="tag">${male?'남성 프로필':'여성 프로필'}</span></div><div id="stepBody">${profileStep()}</div><div id="formError" class="error hidden"></div><div id="saveState" class="save-state"></div><div class="nav">${step>1?'<button class="btn btn-light" data-prev>이전</button>':'<span></span>'}${step<5?'<button class="btn btn-dark" data-next>다음</button>':'<button class="btn btn-dark" data-submit>2차 프로필 제출</button>'}</div></section><p class="security">본인에게만 발급된 만료형 개인화 링크입니다.</p></main>`;bind();};
    const formatDate=v=>{try{return new Date(v).toLocaleString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'numeric',minute:'2-digit'})}catch{return '일정 확인 중'}};
    const renderEvent=()=>{const e=data.form.event_snapshot||{};app.className='';app.innerHTML=`<main><section class="event-cover"><div class="event-inner"><div class="event-brand"><b>IRUM</b><span>PRIVATE SOCIAL INVITATION</span></div><div class="invite"><div class="eyebrow">PERSONAL INVITATION</div><h1>IRUM<br>SOCIAL</h1><p>IRUM이 큐레이션한 프라이빗 소셜에 초대합니다. 참석 전 최소한의 직업 인증을 완료해주세요.</p><div class="event-meta"><div><small>EVENT</small><b>${esc(e.title||'IRUM SOCIAL')}</b></div><div><small>DATE</small><b>${esc(formatDate(e.startsAt))}</b></div><div><small>PLACE</small><b>${esc(e.location||'개별 안내')}</b></div></div>${e.hostName?`<div class="host"><small>IRUM HOST</small><b>${esc(e.hostName)}</b></div>`:''}</div></div></section><section class="event-form"><div class="event-panel"><div class="eyebrow" style="color:#8d8376">PRIVATE RSVP · VERIFICATION</div><h2>초대받으신 분의<br>직업을 확인합니다.</h2><p>현재 소속과 직업을 확인할 수 있는 명함 또는 서류를 첨부해주세요.</p><div class="grid">${input('성함','name',{readonly:true,value:data.form.prefill.name})}${input('연락처','phone',{readonly:true,value:phone(data.form.prefill.phone)})}${input('현재 직업','job',{required:true})}${input('회사·기관·업종','workplace',{required:true})}</div><div class="docs">${documentBox('business_card','명함 또는 직업 인증서류')}</div><div style="margin-top:18px">${consent()}</div><div id="formError" class="error hidden"></div><div id="saveState" class="save-state"></div><button class="btn btn-dark" style="width:100%;min-height:54px" data-submit>인증 완료하기</button></div></section></main>`;bind();};
    const missing=()=>{const type=data.form.form_type;const out=[];const req=(k,l)=>{if(!String(val(k)).trim())out.push(l)};if(type==='social_event'){req('job','현재 직업');req('workplace','회사·기관·업종');if(docState('business_card')!=='verified')out.push('명함 또는 직업 인증서류');if(!val('privacyConsent'))out.push('필수 동의');return out}if(step===1){req('height','키');req('region','거주 지역');req('singleStatus','현재 솔로 여부');req('maritalStatus','혼인 상태');req('marriageIntention','결혼 의향')}if(step===2&&type==='profile_female')req('realCheck','실물 확인 방식');if(step===2&&type==='profile_male'){req('job','현재 직업');req('incomeMale','연소득');req('asset','순자산');if(val('documentDeferred'))req('documentDueDate','서류 제출 예정일');else ['job','income','asset'].forEach(t=>{if(docState(t)!=='verified')out.push(`${t==='job'?'직업':t==='income'?'소득':'자산'} 인증서류`)})}if(step===4){req(type==='profile_male'?'serviceMale':'serviceFemale','원하는 서비스');if(type==='profile_male')req('purpose','만남의 목적')}if(step===5&&!val('privacyConsent'))out.push('필수 동의');if(val('healthFlag')==='yes')req('healthMemo','건강 관련 상세');return out};
    const showError=message=>{const el=document.getElementById('formError');if(!el)return;el.textContent=message;el.classList.toggle('hidden',!message)};
    const queueSave=()=>{clearTimeout(saveTimer);const el=document.getElementById('saveState');if(el)el.textContent='변경사항 저장 대기 중';saveTimer=setTimeout(saveDraft,850)};
    const saveDraft=async()=>{const el=document.getElementById('saveState');if(el)el.textContent='자동 저장 중';try{const r=await request('secondary-draft-save',{expected_revision:revision,draft_payload:form});revision=r.draft_revision;if(el)el.textContent='자동 저장 완료'}catch(e){if(e.code==='DRAFT_CONFLICT'){revision=e.data?.current_revision??revision;if(el)el.textContent='다른 화면의 변경이 감지되었습니다. 새로고침 후 확인해주세요.'}else if(el)el.textContent='자동 저장에 실패했습니다.'}};
    const upload=async(type,file)=>{const err=document.querySelector(`[data-doc-error="${type}"]`);if(err){err.classList.add('hidden');err.textContent=''}if(!file)return;if(file.size>3*1024*1024||!['application/pdf','image/jpeg','image/png','image/webp'].includes(file.type)){if(err){err.textContent='PDF, JPG, PNG, WEBP 형식의 3MB 이하 파일만 가능합니다.';err.classList.remove('hidden')}return}try{const issued=await request('secondary-document-upload-url',{document_type:type,file:{name:file.name,type:file.type,size:file.size}});const put=await fetch(issued.signed_url,{method:'PUT',headers:{'Content-Type':file.type},body:file});if(!put.ok)throw new Error('파일 업로드에 실패했습니다.');await request('secondary-document-complete',{document_id:issued.document_id});await load()}catch(e){if(err){err.textContent=e.message||'파일 업로드에 실패했습니다.';err.classList.remove('hidden')}}};
    const submit=async()=>{if(submitting)return;const miss=missing();if(miss.length){showError(`필수 항목을 확인해 주세요: ${miss.join(', ')}`);return}submitting=true;document.querySelector('[data-submit]')?.setAttribute('disabled','');try{await request('secondary-submit',{submit_idempotency_key:getSubmitKey(),consent_version:'temporary-secondary-v1',payload:form});feedback(data.form.form_type==='social_event'?'직업 인증이 완료되었습니다.':'2차 프로필 등록이 완료되었습니다.','입력해주신 정보를 바탕으로 더 적합한 만남을 준비하겠습니다.',true)}catch(e){showError(e.message||'제출에 실패했습니다.');submitting=false;document.querySelector('[data-submit]')?.removeAttribute('disabled')}};
    const bind=()=>{document.querySelectorAll('[data-input]').forEach(el=>el.addEventListener('input',e=>{form[e.target.dataset.input]=e.target.value;queueSave()}));document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{form[el.dataset.choice]=el.dataset.value;(data.form.form_type==='social_event'?renderEvent:renderProfile)();queueSave()}));document.querySelectorAll('[data-document]').forEach(el=>el.addEventListener('change',e=>upload(e.target.dataset.document,e.target.files?.[0])));document.querySelector('[data-toggle-consent]')?.addEventListener('click',()=>{form.privacyConsent=!form.privacyConsent;(data.form.form_type==='social_event'?renderEvent:renderProfile)();queueSave()});document.querySelector('[data-toggle-deferred]')?.addEventListener('click',()=>{form.documentDeferred=!form.documentDeferred;renderProfile();queueSave()});document.querySelector('[data-prev]')?.addEventListener('click',()=>{showError('');step--;renderProfile()});document.querySelector('[data-next]')?.addEventListener('click',()=>{const miss=missing();if(miss.length){showError(`필수 항목을 확인해 주세요: ${miss.join(', ')}`);return}step++;renderProfile()});document.querySelector('[data-submit]')?.addEventListener('click',submit)};
    const feedback=(title,description,success=false)=>{app.className='feedback';app.innerHTML=`<section class="feedback-card"><div style="font-size:30px;color:${success?'#e7c96e':'#aaa'}">${success?'✓':'◇'}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></section>`};
    const load=async()=>{if(!/^[A-Za-z0-9_-]{40,100}$/.test(token)){feedback('유효하지 않은 링크입니다.','담당자에게 개인화 2차 신청 링크를 요청해주세요.');return}try{data=await request('secondary-public-get');revision=data.form.draft_revision||0;form={...(data.form.draft_payload||{}),name:data.form.prefill.name||'',phone:data.form.prefill.phone||'',privacyConsent:false};data.form.form_type==='social_event'?renderEvent():renderProfile()}catch(e){const title=e.code==='LINK_EXPIRED'?'이 링크는 사용기간이 만료되었습니다.':e.code==='LINK_UNAVAILABLE'?'더 이상 사용할 수 없는 링크입니다.':'접근할 수 없는 링크입니다.';feedback(title,'링크를 확인하거나 담당자에게 문의해주세요.')}};
    load();
  </script>
</body>
</html>
